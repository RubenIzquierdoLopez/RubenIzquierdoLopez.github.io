/* ───────── text normalisation, duplicates, parsing ───────── */
function norm(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/[’‘`´]/g,"'").replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/ñ/g,'ny')
    .normalize('NFD').replace(/[̀-ͯ]/g,'');
}
/* Repeated-word key: ignores case, article, "(e)" endings and the feminine form after "/".
   Accents are kept, so ou / où and a / à stay different words. looseKey also ignores accents, to warn about near repeats. */
function baseKey(fr,keepAccents){
  let s=String(fr==null?'':fr).toLowerCase().replace(/[’‘`´]/g,"'").replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFC');
  if(!keepAccents) s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/\([^)]*\)/g,' ').split('/')[0];
  s=s.replace(/[.,;:!?…"“”«»]/g,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/^(?:l'|(?:le|la|les|un|une|des)\s+)/,'').trim();
  return s;
}
const dupKey=fr=>baseKey(fr,true)||String(fr||'').trim().toLowerCase();
const looseKey=fr=>baseKey(fr,false)||norm(fr).trim();
function normEs(s){
  let t=norm(s).replace(/\([^)]*\)/g,' ').replace(/[¿?¡!.,;:"“”«»]/g,' ').replace(/\s+/g,' ').trim();
  return t.replace(/^(?:el|la|los|las|un|una|unos|unas)\s+/,'').trim();
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
const cleanFr=s=>String(s||'').replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').trim();
const splitEs=v=>(Array.isArray(v)?v:String(v||'').split(/\s*[,/|]\s*/)).map(x=>String(x).replace(/\s+/g,' ').trim()).filter(Boolean);
function parseType(raw){
  const s=norm(raw).replace(/[.()\[\],]/g,' ').replace(/\s+/g,' ').trim();
  if(!s) return {type:null,gender:null};
  let type=null,gender=null;
  for(const tok of s.split(' ')){
    if(ALIASES[tok]&&!type) type=ALIASES[tok];
    if(tok==='nm') gender='m'; else if(tok==='nf') gender='f'; else if(tok==='npl') gender='pl';
    else if(['m','masc','masculin','masculino','masculine'].includes(tok)) gender='m';
    else if(['f','fem','feminin','femenino','feminine'].includes(tok)) gender='f';
    else if(['pl','plural'].includes(tok)) gender='pl';
  }
  if(gender&&!type) type='noun';
  return {type,gender};
}
function inferGender(fr){
  const s=norm(fr);
  if(/^(le|un)\s/.test(s)) return 'm';
  if(/^(la|une)\s/.test(s)) return 'f';
  if(/^(les|des)\s/.test(s)) return 'pl';
  return null;
}
function guessType(fr,es){
  const f=norm(fr);
  if(/^(le|la|les|un|une)\s/.test(f)||/^l'/.test(f)) return 'noun';
  if(es.length&&/^(el|la|los|las)\s/.test(norm(es[0]))) return 'noun';
  if(/^(se\s|s')/.test(f)) return 'verb';
  const first=f.split(/\s+/)[0]; const e=es.length?norm(es[0]):'';
  if(/(er|ir|re|oir)$/.test(f)&&!/\s/.test(f)&&/(ar|er|ir|arse|erse|irse)$/.test(e)) return 'verb';
  return 'other';
}
function build(o){
  const fr=cleanFr(o.fr), es=splitEs(o.es);
  let type=o.type&&TYPES[o.type]?o.type:guessType(fr,es);
  let gender=o.gender||null;
  if(type==='noun'&&!gender) gender=inferGender(fr);
  if(type!=='noun') gender=null;
  return {id:uid(),fr,es,type,gender,cat:String(o.cat||'').trim()||'My words',ex:String(o.ex||'').trim(),exEs:String(o.exEs||'').trim(),
          src:o.src||'mine',lvl:0,due:0,seen:0,ok:0,ko:0,t:Date.now()};
}

function sanitize(d){
  const words=(d.words||[]).filter(w=>w&&typeof w.fr==='string'&&w.fr.trim()).map(w=>({
    id:String(w.id||uid()),fr:cleanFr(w.fr),es:splitEs(w.es),type:TYPES[w.type]?w.type:'other',gender:['m','f','pl'].includes(w.gender)?w.gender:null,

  })).filter(w=>w.es.length);

  const g=d.grammar||{}, done={};
  Object.keys(g.done||{}).forEach(k=>{ if(GBY.has(k)&&g.done[k]) done[k]=1; });
  return {v:1,words,settings:{mode:st.mode==='type'?'type':'reveal',perSession:[5,10,20,30,50].includes(st.perSession)?st.perSession:10},

          grammar:{done,last:GBY.has(g.last)?g.last:'',y:Math.max(0,Number(g.y)||0)}};
}

const byId=id=>S.words.find(w=>w.id===id);
const findDup=(fr,exceptId)=>{const k=dupKey(fr); return S.words.find(w=>w.id!==exceptId&&dupKey(w.fr)===k)||null;};
const findSimilar=(fr,exceptId)=>{const k=dupKey(fr),l=looseKey(fr); return S.words.find(w=>w.id!==exceptId&&dupKey(w.fr)!==k&&looseKey(w.fr)===l)||null;};

/* bulk text → items (new / dup / err) */
function analyze(text,defCat){
  const items=[],idx=new Map(),batch=new Map();
  S.words.forEach(w=>idx.set(dupKey(w.fr),w));
  let cat=defCat||'My words';
  String(text||'').split(/\r?\n/).forEach(line=>{
    let raw=line.trim(); if(!raw) return;
    const h=raw.match(/^#{1,6}\s*(.+?)\s*#*$/); if(h){cat=h[1];return;}
    raw=raw.replace(/^(?:[-*•]\s+|\d+[.)]\s+)/,'');
    let parts=null;
    if(raw.indexOf(';')>=0) parts=raw.split(';');
    else if(raw.indexOf('\t')>=0) parts=raw.split('\t');
    else{
      const m=raw.split(/\s+(?:=|-|–|—|→|->|:)\s+/);
      if(m.length>1) parts=[m[0],m.slice(1).join(' - ')];
      else if(raw.indexOf('|')>=0) parts=raw.split('|');
    }
    if(!parts){items.push({status:'err',line:raw,why:'No Spanish part. Use “french ; spanish”.'});return;}
    parts=parts.map(p=>p.trim());
    const fr=parts[0],es=parts[1];
    if(!items.length&&/^(french|frances|francais)$/.test(norm(fr))&&/^(spanish|espanyol)$/.test(norm(es||''))) return;
    if(!fr||!es){items.push({status:'err',line:raw,why:'French or Spanish part is empty.'});return;}
    const pt=parseType(parts[2]||'');
    const w=build({fr,es,type:pt.type,gender:pt.gender,cat,ex:parts[3]||'',exEs:parts[4]||''});
    const k=dupKey(w.fr);
    if(idx.has(k)) items.push({status:'dup',w,existing:idx.get(k)});
    else if(batch.has(k)) items.push({status:'dup',w,existing:batch.get(k),inBatch:true});
    else{batch.set(k,w);items.push({status:'new',w,similar:findSimilar(w.fr)});}
  });
  return items;
}
function commit(items,src){
  let n=0;
  items.forEach(i=>{ if(i.status==='new'){ i.w.src=src; S.words.push(i.w); n++; } });
  if(n) save();
  return n;
}

/* ───────── derived data ───────── */
const K=new WeakMap();
const keyOf=w=>{let k=K.get(w); if(!k){k=norm(w.fr+' '+w.es.join(' ')+' '+w.cat); K.set(w,k);} return k;};
function topicList(){
  const m=new Map(); S.words.forEach(w=>m.set(w.cat,(m.get(w.cat)||0)+1));
  return Array.from(m,([name,n])=>({name,n}));
}
function typeList(){
  const set=new Set(S.words.map(w=>w.type));
  return Object.keys(TYPES).filter(t=>set.has(t));
}
function filteredWords(){
  const f=S.filter;
  return S.words.filter(w=>(!f.topic||w.cat===f.topic)&&(!f.type||w.type===f.type));
}
function searchWords(q,topic){
  const toks=norm(q).split(/\s+/).filter(Boolean);
  const list=S.words.filter(w=>!topic||w.cat===topic);
  if(!toks.length) return list;
  const qq=toks.join(' '),out=[];
  for(const w of list){
    const k=keyOf(w);
    if(toks.every(t=>k.indexOf(t)>=0)){
      const f=dupKey(w.fr); let sc=3;
      if(f===qq) sc=0; else if(f.indexOf(qq)===0) sc=1; else if(w.es.some(e=>normEs(e).indexOf(qq)===0)) sc=2;
      out.push([sc,w]);
    }
  }
  out.sort((a,b)=>a[0]-b[0]);
  return out.map(x=>x[1]);
}
function refreshTopics(){
  $('#topics').innerHTML=topicList().map(t=>'<option value="'+esc(t.name)+'"></option>').join('');
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function speakText(w){return w.fr.split('/')[0].replace(/\(.*?\)/g,'').replace(/…/g,'').trim();}
const canSpeak='speechSynthesis' in window;
/* Pick a French voice on purpose. Setting only lang makes Android fall back to the phone's own language (Spanish) when French voice data is missing. */
function voiceState(){
  let vs=[]; try{vs=(speechSynthesis.getVoices()||[]).slice();}catch(e){}
  const fr=vs.filter(v=>/^fr([-_]|$)/i.test(v.lang||''));
  const rank=v=>(/^fr[-_]fr$/i.test(v.lang)?0:2)+(v.localService?0:1);
  fr.sort((a,b)=>rank(a)-rank(b));
  return {known:vs.length>0, voice:fr[0]||null};
}
function speak(t){
  if(!canSpeak) return;
  try{
    const st=voiceState();
    if(st.known&&!st.voice){ toast('No French voice on this phone, so it would sound Spanish. See Settings > Pronunciation.',5000); return; }
    const u=new SpeechSynthesisUtterance(t);
    if(st.voice){ u.voice=st.voice; u.lang=st.voice.lang; } else u.lang='fr-FR';
    u.rate=.9; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function voiceCard(){
  if(!canSpeak) return '<section class="card"><h2>Pronunciation</h2><p>This browser cannot read text aloud.</p></section>';
  const st=voiceState(), name=st.voice?(st.voice.name||'French')+' · '+st.voice.lang:'';
  const msg=st.voice?'French voice found: '+esc(name)+'.'
    :st.known?'No French voice is installed on this phone, so words would be read with a Spanish accent.<br><br>To fix it on Android: open Settings, search for “Text-to-speech output”, tap the gear next to Google (or your engine), choose “Install voice data”, and download French (France). Then reopen this app.'
    :'The phone has not listed its voices yet. Tap “Test the voice” and listen: it should say a French sentence.';
  return '<section class="card" id="voice-card"><h2>Pronunciation</h2><p>'+msg+'</p><button class="btn ghost wide" data-act="test-voice">Test the voice</button></section>';
}
if(canSpeak){ try{ speechSynthesis.addEventListener('voiceschanged',()=>{ const c=$('#voice-card'); if(c) c.outerHTML=voiceCard(); }); }catch(e){} }
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}
}

/* ── Session ── */
function startSession(practice){
  const now=Date.now(),f=filteredWords();
  let ids;
  if(practice) ids=shuffle(f.slice()).slice(0,10).map(w=>w.id);
  else{
    /* most overdue reviews first (capped), new words picked at random, then everything mixed together */
    const due=f.filter(w=>w.seen&&w.due<=now).sort((a,b)=>a.due-b.due).slice(0,MAX_DUE);
    const fresh=shuffle(f.filter(w=>!w.seen)).slice(0,S.settings.perSession);
    ids=shuffle(due.concat(fresh)).map(w=>w.id);
  }
  if(!ids.length){toast('Nothing to study with these filters');return;}
  ui.session={queue:ids.slice(),total:ids.length,i:0,revealed:false,result:null,attempted:new Set(),right:0,wrong:[],practice:!!practice,mode:S.settings.mode};
  render();
}
function frSize(t){const n=t.length; return n<=9?60:n<=15?48:n<=24?38:31;}
function renderSession(){
  const s=ui.session;
  if(s.i>=s.queue.length){renderSummary();return;}
  const w=byId(s.queue[s.i]);
  if(!w){s.i++;renderSession();return;}
  const done=s.attempted.size,pct=Math.round(done/s.total*100);
  const isType=s.mode==='type';
  let h='<div class="sess"><div class="sess-top"><button class="icon-btn" data-act="end" aria-label="End session">'+IC.close+'</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+s.total+'" aria-valuenow="'+done+'"><i style="width:'+pct+'%"></i></div><span class="count">'+Math.min(done+1,s.total)+' / '+s.total+'</span></div>';
  h+='<div class="sess-body"><article class="plate" style="--fr-size:'+frSize(w.fr)+'px"><div class="plate-top">'+roundel(w.type)
    +(w.gender?'<span class="tag">'+GENDER_LABEL[w.gender]+'</span>':'')+(!w.seen&&!s.practice?'<span class="tag new">new</span>':'')+'<span class="grow"></span>'
    +(canSpeak?'<button class="icon-btn light" data-act="speak" aria-label="Pronounce">'+IC.speak+'</button>':'')+'</div>'
    +'<h2 class="fr" lang="fr">'+esc(w.fr)+'</h2><div class="plate-foot">'+esc(w.cat)+'</div></article>';
  if(s.revealed){
    h+='<section class="answer">';
    if(s.result&&isType){
      const r=s.result;
      h+=r.ok?'<div class="verdict ok">Correct'+(r.close?' <small>check the spelling</small>':'')+'</div>':'<div class="verdict no">'+(r.skipped?'Answer':'Not quite')+(r.ans?' <small>you wrote “'+esc(r.ans)+'”</small>':'')+'</div>';
    }
    h+='<p class="es" lang="es">'+w.es.map(esc).join(' · ')+'</p>';
    if(w.ex) h+='<div class="ex"><span lang="fr">'+esc(w.ex)+'</span>'+(w.exEs?'<span lang="es">'+esc(w.exEs)+'</span>':'')+'</div>';
    h+='</section>';
  }else if(!isType){
    h+='<p class="prompt">Say it in Spanish, then check.</p>';
  }
  h+='</div><div class="sess-actions">';
  if(!isType){
    h+=s.revealed?'<div class="two"><button class="btn again" data-act="again">Again</button><button class="btn good" data-act="good">Got it</button></div>'
                 :'<button class="btn primary wide" data-act="reveal">Show answer</button>';
  }else if(!s.revealed){
    h+='<form id="tform" autocomplete="off"><input id="typed" type="text" lang="es" placeholder="Type the Spanish" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Spanish translation"><div class="two" style="margin-top:10px"><button type="button" class="btn ghost" data-act="skip">I don’t know</button><button type="submit" class="btn primary">Check</button></div></form>';
  }else{
    h+=(s.result&&!s.result.ok?'<button class="link" data-act="override">I was right, count it as correct</button>':'')+'<button class="btn primary wide" data-act="next">Next</button>';
  }
  h+='</div></div>';
  view.innerHTML=h;
  if(isType&&!s.revealed){const t=$('#typed'); if(t) setTimeout(()=>t.focus(),30);}
}
function checkTyped(w,raw){
  const parts=String(raw).split(/\s*[,/]\s*/).map(normEs).filter(Boolean);
  if(!parts.length) return {ok:false,ans:''};
  const vars=w.es.map(normEs).filter(Boolean);
  const res=parts.map(p=>vars.includes(p)?1:(p.length>=5&&vars.some(v=>v.length>=5&&lev(p,v)<=1)?2:0));
  return {ok:res.every(r=>r>0),close:res.some(r=>r===2),ans:String(raw).trim()};
}
function answer(correct){
  const s=ui.session,id=s.queue[s.i],w=byId(id),now=Date.now();
  const first=!s.attempted.has(id);
  s.attempted.add(id);
  if(!s.practice&&w){
    if(first){
      if(correct){w.lvl=Math.min(5,w.lvl+1);w.due=now+INT[w.lvl]*DAY;w.ok++;}
      else{w.lvl=Math.max(0,w.lvl-2);w.due=now;w.ko++;}
      w.seen=1;
    }else if(correct){w.due=now+INT[w.lvl]*DAY;}
    save();
  }
  if(first){ if(correct) s.right++; else s.wrong.push(id); }
  if(!correct) s.queue.splice(Math.min(s.queue.length,s.i+4),0,id);
  s.i++;s.revealed=false;s.result=null;
  render();
}
function renderSummary(){
  const s=ui.session,n=s.attempted.size,missed=s.wrong.map(byId).filter(Boolean);
  let h='<div class="sum"><h1>'+(s.practice?'Practice done':'Session done')+'</h1><p class="big">'+s.right+'<span>/'+n+'</span></p><p class="sub">right on the first try</p>';
  if(missed.length){
    h+='<section class="sect"><h2>To review</h2><div class="list">'+missed.map(w=>'<div class="row" style="cursor:default">'+roundel(w.type)+'<span class="row-main"><b lang="fr">'+esc(w.fr)+'</b><span>'+esc(w.es.join(' · '))+'</span></span></div>').join('')+'</div></section>';
  }
  h+='<div class="stack"><button class="btn primary wide" data-act="more-session">Study more</button><button class="btn ghost wide" data-act="end">Back to study</button></div></div>';
  view.innerHTML=h;view.scrollTop=0;
}

  if(b.t==='ex') return '<div class="exs">'+b.items.map(pr=>'<div class="exr"><div><div class="fr" lang="fr">'+esc(stripM(pr[0]))+'</div><div class="es" lang="es">'+esc(stripM(pr[1]))+'</div></div>'
      +(canSpeak?'<button class="icon-btn" data-act="g-speak" data-t="'+esc(stripM(pr[0]))+'" aria-label="Listen">'+IC.speak+'</button>':'')+'</div>').join('')+'</div>';
  if(b.t==='note') return '<div class="gnote '+b.k+'"><b>'+(NOTE[b.k]||'Note')+'</b>'+inl(b.x)+'</div>';
  return '';
}
/* search: accent-insensitive, every word must appear; the fold keeps string length so snippets can be cut from the original */
const fold=s=>Array.from(String(s).toLowerCase()).map(c=>{const d=c.normalize('NFD')[0]; return d==='’'?"'":d;}).join('');
function gidx(l){
  if(l._i) return l._i;
  const a=[];
  l.blocks.forEach(b=>{
    if(b.t==='h'||b.t==='p') a.push(b.x); else if(b.t==='ul') a.push.apply(a,b.items);
    else if(b.t==='table') b.rows.forEach(r=>a.push(r.join(' · ')));
    else if(b.t==='ex') b.items.forEach(p=>a.push(p[0]+' — '+p[1])); else if(b.t==='note') a.push(b.x);
  });
  const body=stripM(a.join('\n'));
  return (l._i={body,fb:fold(body),head:fold(stripM(l.en+' '+l.fr)),key:fold(stripM(l.key))});
}
function gsearch(q){
  const toks=fold(q).split(/\s+/).filter(Boolean); if(!toks.length) return [];
  const out=[];
  GL.forEach(l=>{
    const i=gidx(l), hay=i.head+'\n'+i.key+'\n'+i.fb;
    if(!toks.every(t=>hay.includes(t))) return;
    let sc=0; toks.forEach(t=>{ if(i.head.includes(t)) sc+=3; if(i.key.includes(t)) sc+=2; if(i.fb.includes(t)) sc+=1; });
    out.push({l,sc,toks});
  });
  return out.sort((a,b)=>b.sc-a.sc||a.l.n-b.l.n);
}
function gsnip(l,toks){
  const i=gidx(l); let pos=-1;
  toks.forEach(t=>{ const p=i.fb.indexOf(t); if(p>=0&&(pos<0||p<pos)) pos=p; });
  let text,f,pre='',post='';
  if(pos<0){ text=stripM(l.key); f=fold(text); }
  else{
    let s=Math.max(0,pos-36), e=Math.min(i.body.length,pos+96);
    if(s>0){ const m=i.body.slice(s,pos).search(/[\s·]/); if(m>=0) s+=m+1; }
    if(e<i.body.length){ const k=i.body.slice(pos,e).search(/[\s·][^\s·]*$/); if(k>0) e=pos+k; }
    text=i.body.slice(s,e); f=i.fb.slice(s,e); pre=s>0?'… ':''; post=e<i.body.length?' …':'';
  }
  const m=[]; toks.forEach(t=>{ let p=0; while((p=f.indexOf(t,p))>=0){ m.push([p,p+t.length]); p+=t.length; } });
  m.sort((a,b)=>a[0]-b[0]);
  let out='',c=0;
  m.forEach(([a,b])=>{ if(b<=c) return; if(a<c) a=c; out+=esc(text.slice(c,a))+'<mark>'+esc(text.slice(a,b))+'</mark>'; c=b; });
  out+=esc(text.slice(c));
  return pre+out.replace(/\n/g,' · ')+post;
}
const gDone=l=>!!S.grammar.done[l.id];
const gCount=()=>GL.filter(gDone).length;
function lessonRow(l,snip){
  const d=gDone(l);
  return '<button class="row lrow" data-act="g-open" data-id="'+l.id+'" aria-label="'+(d?'Reviewed. ':'')+esc(l.en)+'"><span class="ck'+(d?' on':'')+'" aria-hidden="true">'+(d?IC.check:l.n)+'</span>'
    +'<span class="row-main"><b>'+esc(l.en)+'</b><span lang="fr">'+esc(l.fr)+'</span>'+(snip?'<span class="snip">'+snip+'</span>':'')+'</span><span class="chev">'+IC.chev+'</span></button>';
}
function renderLessons(){
  const N=GL.length, D=gCount(), last=GBY.get(S.grammar.last);
  const F=[['all','All'],['todo','To review'],['done','Reviewed']];
  let h=(storageOK?'':'<div class="banner">Preview mode: progress is not saved here. Open the installed app to keep your reviewed marks.</div>');
  h+='<header class="head"><div><h1>Reviewing grammar</h1><p class="sub">A1 rules · '+N+' lessons</p></div><span class="count" id="gcount">'+D+' / '+N+'</span></header>';
  h+='<div class="gprog"><div class="prog" role="img" aria-label="'+D+' of '+N+' lessons reviewed"><i style="width:'+(N?(D/N*100).toFixed(1):0)+'%"></i></div></div>';
  if(last) h+='<button class="cont" data-act="g-continue"><span><small>Continue</small><b>'+esc(last.en)+'</b></span><span class="go">'+IC.chev+'</span></button>';
  h+='<div class="searchbar" style="margin-top:10px"><div class="field">'+IC.search+'<input id="gq" type="search" placeholder="Search the rules" value="'+esc(ui.gq)+'" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Search grammar">'
    +'<button class="icon-btn clear" id="gq-clear" data-act="g-clear" aria-label="Clear search"'+(ui.gq?'':' hidden')+'>'+IC.close+'</button></div>'
    +'<div class="seg gfilter" role="group" aria-label="Show">'+F.map(([v,l])=>'<button data-act="g-filter" data-v="'+v+'" aria-pressed="'+(ui.gfilter===v)+'">'+l+'</button>').join('')+'</div></div><div id="glist"></div>';
  view.innerHTML=h;
  updateGList();
}
function updateGList(){
  const box=$('#glist'); if(!box) return;
  const q=ui.gq.trim(), keep=l=>ui.gfilter==='all'||(ui.gfilter==='done')===gDone(l);
  const clr=$('#gq-clear'); if(clr) clr.hidden=!ui.gq;
  const gc=$('#gcount'); if(gc) gc.textContent=gCount()+' / '+GL.length;
  if(q){
    const res=gsearch(q).filter(r=>keep(r.l));
    if(!res.length){ box.innerHTML='<div class="empty"><h2>No match</h2><p>Nothing in the grammar mentions “'+esc(q)+'”'+(ui.gfilter!=='all'?' with this filter':'')+'.</p></div>'; return; }
    box.innerHTML='<div class="grp">'+res.length+(res.length===1?' lesson':' lessons')+'</div><div class="list">'+res.slice(0,40).map(r=>lessonRow(r.l,gsnip(r.l,r.toks))).join('')+'</div>';
    return;
  }
  let h='';
  GR.parts.forEach((p,pi)=>{
    const ls=p.lessons.filter(keep); if(!ls.length) return;
    h+='<div class="grp">'+(pi+1)+' · '+esc(p.title)+'</div><div class="list">'+ls.map(l=>lessonRow(l)).join('')+'</div>';
  });
  box.innerHTML=h||'<div class="empty"><h2>'+(ui.gfilter==='done'?'Nothing reviewed yet':'All reviewed')+'</h2><p>'+(ui.gfilter==='done'?'Open a lesson and tap “Mark as reviewed”.':'Great work. Every lesson is marked as reviewed.')+'</p></div>';
}
function renderLesson(){
  const l=GBY.get(ui.lesson); if(!l){ui.lesson=null;render();return;}
  const d=gDone(l), N=GL.length, part=GR.parts[l.pi];
  let h='<div class="rd-bar"><button class="icon-btn" data-act="g-back" aria-label="Back to lessons">'+IC.back+'</button><span class="rd-pos">Lesson '+l.n+' of '+N+' · '+esc(part.title)+'</span>'+(d?'<span class="rd-done">'+IC.check+' Reviewed</span>':'')+'</div>';
  h+='<div class="rd-title"><h1>'+esc(l.en)+'</h1><p class="frt" lang="fr">'+esc(l.fr)+'</p></div>';
  h+='<div class="keybox"><small>In short</small>'+inl(l.key)+'</div>';
  h+=l.blocks.map(blockHTML).join('');
  h+='<div class="rd-end"><button class="btn wide '+(d?'ghost':'primary')+'" data-act="g-done">'+(d?'Reviewed ✓ · tap to undo':'Mark as reviewed')+'</button>'
    +'<div class="two"><button class="btn ghost" data-act="g-prev"'+(l.n>1?'':' disabled')+'>← Previous</button><button class="btn ghost" data-act="g-next"'+(l.n<N?'':' disabled')+'>Next →</button></div>'
    +'<p class="rd-src">Short A1 summary written for this app. The same topic appears in: '+l.src.map(s=>esc(GSRC[s])).join(' and ')+'.</p></div>';
  view.innerHTML=h;
}
function openLesson(id,resume){
  if(!GBY.has(id)) return;
  if(!ui.lesson) ui.listY=view.scrollTop;
  const same=S.grammar.last===id; ui.lesson=id; S.grammar.last=id; if(!(resume&&same)) S.grammar.y=0; save();
  if(!ui.hist){ try{history.pushState({lesson:1},'');ui.hist=true;}catch(e){} }
  render(); view.scrollTop=S.grammar.y;
}
function leaveLesson(){ ui.lesson=null; render(); view.scrollTop=ui.listY||0; }
function closeLesson(){
  if(ui.hist){ try{history.back();return;}catch(e){ui.hist=false;} }
  leaveLesson();
}
window.addEventListener('popstate',()=>{ if(ui.lesson){ ui.hist=false; leaveLesson(); } });
let scrollT=0;
view.addEventListener('scroll',()=>{
  if(!ui.lesson) return;
  clearTimeout(scrollT);
  scrollT=setTimeout(()=>{ if(ui.lesson&&S.grammar.last===ui.lesson){ S.grammar.y=Math.round(view.scrollTop); save(); } },400);
},{passive:true});

/* ── Settings ── */
function renderMore(){
  const gram=ui.section==='grammar', N=GL.length, D=gCount();
  let h=(storageOK?'':'<div class="banner">Preview mode: this view cannot store data. Anything you add or mark here will be lost when you close it.</div>')+'<header class="head"><h1>Settings</h1></header>';
  const backup='<section class="card"><h2>Backup</h2><p>Your words, grammar progress and settings live on this phone. Keep a copy now and then.</p><button class="btn ghost wide" data-act="backup-file">Download backup file</button><button class="btn ghost wide" data-act="backup-copy">Copy backup text</button>'
   +'<label for="restore-file">Restore from a backup file</label><input id="restore-file" type="file" accept=".json,application/json">'
   +'<label for="restore-text">…or paste backup text</label><textarea id="restore-text" style="min-height:90px" spellcheck="false"></textarea><button class="btn ghost wide" data-act="restore-text">Restore</button></section>';
  if(gram){
    h+='<section class="card"><h2>Grammar progress</h2><p>'+D+' of '+N+' lessons are marked as reviewed.</p><button class="btn ghost wide" data-act="g-reset"'+(D?'':' disabled')+'>Clear reviewed marks</button></section>'+voiceCard()+backup;
  }else{
    const a1=analyze(A1TEXT,'A1'),a1total=a1.length,miss=a1.filter(i=>i.status==='new').length;
    h+='<section class="card"><h2>Answering</h2><div class="seg" role="group" aria-label="Answer mode"><button data-act="mode" data-v="reveal" aria-pressed="'+(S.settings.mode==='reveal')+'">Think and reveal</button><button data-act="mode" data-v="type" aria-pressed="'+(S.settings.mode==='type')+'">Type the answer</button></div>'
     +'<label for="perSession">New words per session</label><select id="perSession">'+[5,10,20,30,50].map(n=>'<option value="'+n+'"'+(S.settings.perSession===n?' selected':'')+'>'+n+'</option>').join('')+'</select></section>'
     +'<section class="card"><h2>A1 starter pack</h2><p>'+(a1total-miss)+' of '+a1total+' starter words are in your list.</p><button class="btn ghost wide" data-act="restore-a1"'+(miss?'':' disabled')+'>'+(miss?'Add the '+miss+' missing words':'Nothing missing')+'</button></section>'
     +voiceCard()+backup
     +'<section class="card"><h2>Reset</h2><button class="btn danger wide" data-act="reset-progress">Reset all progress</button><button class="btn danger wide" data-act="delete-all">Delete all words</button></section>';
  }
  view.innerHTML=h+'<p class="sub" style="padding:18px 2px">Mots du métro · '+S.words.length+' words · '+N+' grammar lessons · stored on this device only.</p>';
}
function restoreFrom(text){
  let d; try{d=JSON.parse(text);}catch(e){toast('That is not a valid backup');return;}
  d=d&&d.data?d.data:d;
  if(!d||!Array.isArray(d.words)){toast('No words found in that backup');return;}
  const next=sanitize(d);
  if(!d.grammar) next.grammar=S.grammar;
  next.section=ui.section;
  confirmSheet('Replace your words?','This backup has '+next.words.length+' words. It replaces the '+S.words.length+' words on this phone.','Replace',()=>{S=next;ui.lesson=null;save();refreshTopics();closeSheet();render();toast('Backup restored');});
}
function exportJSON(){return JSON.stringify({app:'mots-du-metro',v:1,exported:new Date().toISOString(),data:S});}

/* ───────── events ───────── */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act,id=el.dataset.id,s=ui.session;
  switch(act){
    case 'tab': setTab(el.dataset.tab); break;
    case 'section': if(el.dataset.v!==ui.section) setSection(el.dataset.v); break;
    case 'g-open': openLesson(id,false); break;
    case 'g-continue': openLesson(S.grammar.last,true); break;
    case 'g-back': closeLesson(); break;
    case 'g-clear': ui.gq=''; { const q=$('#gq'); if(q){q.value='';q.focus();} } updateGList(); break;
    case 'g-filter': ui.gfilter=el.dataset.v; document.querySelectorAll('.gfilter button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===ui.gfilter))); updateGList(); break;
    case 'test-voice': speak('Bonjour ! Je m’appelle Marie. Comment allez-vous ?'); break;
    case 'g-speak': speak(String(el.dataset.t||'').replace(/\([^)]*\)/g,'')); break;
    case 'g-done': { const l=GBY.get(ui.lesson); if(!l) break; const y=view.scrollTop; if(S.grammar.done[l.id]){delete S.grammar.done[l.id];toast('Mark removed');} else {S.grammar.done[l.id]=1;toast('Marked as reviewed');} save(); render(); view.scrollTop=y; break; }
    case 'g-prev': case 'g-next': { const l=GBY.get(ui.lesson); const n=l&&GL[l.n-1+(act==='g-next'?1:-1)]; if(n){ ui.lesson=n.id; S.grammar.last=n.id; S.grammar.y=0; save(); render(); view.scrollTop=0; } break; }
    case 'g-reset': confirmSheet('Clear reviewed marks?','All '+gCount()+' grammar lessons go back to “to review”. The lessons stay.','Clear',()=>{S.grammar.done={};save();render();toast('Marks cleared');}); break;
    case 'start': startSession(false); break;
    case 'practice': startSession(true); break;
    case 'more-session': ui.session=null; startSession(!!(s&&s.practice)); break;
    case 'end': ui.session=null; render(); break;
    case 'speak': { const w=byId(s.queue[s.i]); if(w) speak(speakText(w)); break; }
    case 'reveal': s.revealed=true; render(); break;
    case 'again': answer(false); break;
    case 'good': answer(true); break;
    case 'skip': s.revealed=true; s.result={ok:false,ans:'',skipped:true}; render(); break;
    case 'override': s.result.ok=true; s.result.close=false; render(); break;
    case 'next': answer(!!(s.result?s.result.ok:true)); break;
    case 'clearq': ui.q=''; { const q=$('#wq'); if(q){q.value='';q.focus();} } updateWordList(); break;
    case 'edit': openEdit(id); break;
    case 'add-from-search': ui.prefill={fr:ui.q.trim()}; ui.addMode='quick'; setTab('add'); break;
    case 'addmode': ui.addMode=el.dataset.v; renderAdd(); break;
    case 'q-save': submitQuick(); break;
    case 'bulk-add': submitBulk(); break;
    case 'copy-prompt': toast((await copyText(AI_PROMPT))?'Prompt copied. Paste it into any AI chat, then add your course text.':'Could not copy here'); break;
    case 'dup-edit': openEdit(id); break;
    case 'dup-merge': {
      const d=byId(id),es=splitEs(($('#q-es')||{}).value); if(!d) break;
      es.forEach(x=>{ if(!d.es.some(y=>normEs(y)===normEs(x))) d.es.push(x); });
      K.delete(d); save(); toast('Translation added to '+d.fr);
      ['fr','es','ex','exEs'].forEach(k=>{$('#q-'+k).value='';}); refreshDup('q'); $('#q-fr').focus(); break;
    }
    case 'e-save': saveEdit(id); break;
    case 'e-del': {
      const w=byId(id); if(!w) break;
      confirmSheet('Delete “'+w.fr+'”?','This removes the word and its progress.','Delete',()=>{S.words=S.words.filter(x=>x.id!==id);save();refreshTopics();closeSheet();if(ui.tab==='words')updateWordList();else render();toast('Deleted');});
      break;
    }
    case 'reset-word': { const w=byId(id); if(w){w.lvl=0;w.due=0;w.seen=0;w.ok=0;w.ko=0;save();closeSheet();if(ui.tab==='words')updateWordList();toast('Progress reset');} break; }
    case 'closesheet': closeSheet(); break;
    case 'confirm-ok': { const fn=confirmSheet.fn; confirmSheet.fn=null; closeSheet(); if(fn) fn(); break; }
    case 'mode': S.settings.mode=el.dataset.v; save(); renderMore(); break;
    case 'restore-a1': {
      const n=commit(analyze(A1TEXT,'A1'),'a1'); refreshTopics(); toast(n?('Added '+n+' starter words'):'Nothing missing'); render(); break;
    }
    case 'backup-file': {
      try{const b=new Blob([exportJSON()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mots-du-metro-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Backup downloaded');}
      catch(err){toast('Download is not available here. Use Copy backup text.');}
      break;
    }
    case 'backup-copy': toast((await copyText(exportJSON()))?'Backup copied':'Could not copy here'); break;
    case 'restore-text': { const t=($('#restore-text')||{}).value||''; if(!t.trim()){toast('Paste the backup text first');break;} restoreFrom(t); break; }
    case 'reset-progress': confirmSheet('Reset all progress?','Every word goes back to new. Your words stay.','Reset',()=>{S.words.forEach(w=>{w.lvl=0;w.due=0;w.seen=0;w.ok=0;w.ko=0;});save();render();toast('Progress reset');}); break;
    case 'delete-all': confirmSheet('Delete all words?','This removes all '+S.words.length+' words and your progress. You can bring the A1 pack back from Settings.','Delete everything',()=>{S.words=[];save();refreshTopics();render();toast('All words deleted');}); break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id||'';
  if(id==='wq'){ui.q=t.value;updateWordList();}
  else if(id==='gq'){ui.gq=t.value;updateGList();}
  else if(/^(q|e)-(fr|es)$/.test(id)){refreshDup(id[0],id[0]==='e'?ui.editId:undefined);}
  else if(/^(q|e)-type$/.test(id)){syncGender(id[0]);}
  else if(id==='bulk'||id==='bulk-cat'){refreshBulk();}
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id||'';
  if(id==='wtopic'){ui.wtopic=t.value;updateWordList();}
  else if(id==='ftopic'){S.filter.topic=t.value;save();renderStudy();}
  else if(id==='ftype'){S.filter.type=t.value;save();renderStudy();}
  else if(id==='perSession'){S.settings.perSession=parseInt(t.value,10)||10;save();}
  else if(id==='restore-file'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>restoreFrom(String(r.result));r.readAsText(t.files[0]);}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='tform') return;
  e.preventDefault();
  const s=ui.session; if(!s) return;
  const w=byId(s.queue[s.i]); if(!w) return;
  const v=($('#typed')||{}).value||'';
  if(!v.trim()){toast('Type your answer, or tap I don’t know');return;}
  s.result=checkTyped(w,v); s.revealed=true; render();
});
document.addEventListener('keydown',e=>{
  const s=ui.session;
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();return;}
  if(!s||e.key!=='Enter'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON') return;
  if(s.mode==='type'){ if(s.revealed) answer(!!(s.result&&s.result.ok)); }
  else if(!s.revealed){s.revealed=true;render();}
  else answer(true);
});
/* Enter in the quick-add fields moves on, and saves from the last one */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const id=e.target.id||'';
  if(id==='q-fr'){e.preventDefault();$('#q-es').focus();}
  else if(id==='q-es'){e.preventDefault();submitQuick();}
  else if(id==='e-es'||id==='e-exEs'){e.preventDefault();saveEdit(ui.editId);}
});

/* ───────── start ───────── */
storageOK=testStorage();
S=load();
if(!S){
  S=freshState();
  commit(analyze(A1TEXT,'A1'),'a1');
  save();
}
ui.section=S.section==='grammar'?'grammar':'vocab'; ui.tab=ui.section==='grammar'?'lessons':'study';
refreshTopics();
render();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}

})();
</script>
