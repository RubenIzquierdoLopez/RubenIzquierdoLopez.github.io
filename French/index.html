<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mots du métro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#123B7A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-sc-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-sc-700.woff2) format("woff2")}

:root{
  /* Layout idea: a metro nameplate card on cool paper, big thumb-reach actions at the bottom, a tab bar that reads like a line strip. */
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#586579; --line:#D3DAE5; --soft:#E2E8F1;
  --enamel:#123B7A; --enamel-ink:#FFFFFF; --signal:#FFCE00; --signal-ink:#1A1400;
  --cta:#123B7A; --cta-ink:#FFFFFF; --focus:#2F6FDE;
  --good:#1F7A4D; --good-ink:#FFFFFF; --bad:#B3261E;
  --c-new:#9AA7BB; --c-learn:#E8A200; --c-fam:#4C93D6; --c-known:#1F7A4D; --tint:#E6EDFA; --warn-bg:#FBEAE8;
  --font-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1120; --surface:#121C31; --ink:#E9EEF8; --muted:#97A4BB; --line:#24324D; --soft:#1A2640;
    --enamel:#17418A; --enamel-ink:#FFFFFF; --cta:#FFCE00; --cta-ink:#1A1400; --focus:#FFCE00;
    --good:#4CC38A; --good-ink:#06200F; --bad:#FF8279;
    --c-new:#5E6C86; --c-learn:#F0B429; --c-fam:#6FB1EC; --c-known:#4CC38A; --tint:#1E3157; --warn-bg:#3A1A1E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1120; --surface:#121C31; --ink:#E9EEF8; --muted:#97A4BB; --line:#24324D; --soft:#1A2640;
  --enamel:#17418A; --enamel-ink:#FFFFFF; --cta:#FFCE00; --cta-ink:#1A1400; --focus:#FFCE00;
  --good:#4CC38A; --good-ink:#06200F; --bad:#FF8279;
  --c-new:#5E6C86; --c-learn:#F0B429; --c-fam:#6FB1EC; --c-known:#4CC38A; --tint:#1E3157; --warn-bg:#3A1A1E;
  color-scheme:dark;
}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 17px/1.4 var(--font-body);overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top) 16px 28px}
body.in-session #view{padding-bottom:0;overflow:hidden;display:flex;flex-direction:column}

h1{font:700 34px/1.05 var(--font-display);margin:0;text-wrap:balance}
h2{font:700 22px/1.15 var(--font-display);margin:0 0 10px}
p{margin:0}
.head{padding:20px 0 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
.hint{color:var(--muted);font-weight:400;font-size:13.5px;margin-left:4px}
.count{font:600 15px var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border:2px solid transparent;border-radius:14px;font:700 20px/1 var(--font-display);letter-spacing:.01em;cursor:pointer;color:var(--ink);background:var(--surface);text-align:center}
.btn.wide{width:100%}
.btn.primary{background:var(--cta);color:var(--cta-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.good{background:var(--good);color:var(--good-ink)}
.btn.again{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:44px;font-size:17px;padding:0 14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.link{background:none;border:0;color:var(--muted);font:600 16px var(--font-body);text-decoration:underline;padding:10px;cursor:pointer}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:inherit;cursor:pointer}
.icon-btn.light{color:var(--enamel-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* tab bar */
#tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs[hidden]{display:none}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0 9px;border:0;background:none;color:var(--muted);font:600 12.5px var(--font-body);letter-spacing:.02em;cursor:pointer}
#tabs button[aria-current="page"]{color:var(--ink)}
#tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:24%;right:24%;height:4px;border-radius:0 0 4px 4px;background:var(--signal)}

/* roundels: type badges in metro-line colours */
.roundel{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 9px;border-radius:17px;background:var(--rb,#888);color:var(--ri,#fff);font:700 15px/1 var(--font-display);letter-spacing:.01em;flex:none}
.t-noun{--rb:#FFCE00;--ri:#1A1400}
.t-verb{--rb:#BB4D98;--ri:#fff}
.t-adjective{--rb:#00814F;--ri:#fff}
.t-adverb{--rb:#F3A4BA;--ri:#2A0A14}
.t-preposition{--rb:#98D4E2;--ri:#07252C}
.t-pronoun{--rb:#DE8B53;--ri:#2A1000}
.t-conjunction{--rb:#B6BD00;--ri:#1E2000}
.t-determiner{--rb:#CEADD2;--ri:#27102B}
.t-number{--rb:#8D5E2A;--ri:#fff}
.t-expression{--rb:#662483;--ri:#fff}
.t-other{--rb:#7C8799;--ri:#fff}
.tag{font:600 13px/1 var(--font-body);letter-spacing:.04em;text-transform:uppercase;padding:6px 9px;border-radius:8px;border:1.5px solid currentColor;opacity:.9}
.tag.new{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);opacity:1}

/* home ticket */
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ticket-top{display:flex;align-items:center;gap:18px;padding:20px 20px 18px}
.big-n{font:700 68px/0.9 var(--font-display);font-variant-numeric:tabular-nums;min-width:70px}
.t-label{font:700 22px/1.1 var(--font-display)}
.t-sub{color:var(--muted);font-size:15px;margin-top:3px}
.ticket-cut{position:relative;border-top:2px dashed var(--line);margin:0 14px}
.ticket-cut::before,.ticket-cut::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket-cut::before{left:-25px}
.ticket-cut::after{right:-25px}
.ticket-bot{display:grid;gap:10px;padding:18px 20px 20px}
.sect{margin-top:22px}
.sect>h2{font-size:18px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:10px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lvlbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);gap:2px}
.lvlbar i{display:block;min-width:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px;color:var(--muted);font-size:15px}
.legend span{display:flex;align-items:center;gap:8px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink)}
.empty .btn{margin:18px auto 0;max-width:280px}
.banner{background:var(--signal);color:var(--signal-ink);border-radius:12px;padding:11px 14px;font-weight:600;font-size:15px;margin-top:14px}

/* forms */
label{display:block;font:600 14.5px var(--font-body);color:var(--muted);margin:16px 0 6px;letter-spacing:.02em}
input,select,textarea{width:100%;font-size:18px;font-weight:500;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px}
input[type=file]{padding:10px;font-size:15px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
textarea{resize:vertical;min-height:170px;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:13px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 16px var(--font-body);padding:11px 8px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.stack{display:grid;gap:10px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.card p{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.card .btn{margin-top:8px}
.dup{margin-top:12px;border:1.5px solid var(--bad);border-radius:14px;padding:12px 14px;background:var(--surface)}
.dup b{color:var(--bad);font-weight:700}
.dup-w{font:700 21px/1.2 var(--font-display);margin:6px 0 2px}
.dup small{color:var(--muted);font-size:14px}
.note{margin-top:10px;border-left:4px solid var(--signal);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:15.5px;color:var(--muted)}
.note b{color:var(--ink)}
.dup-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font:600 14.5px var(--font-body);padding:7px 12px;border-radius:999px;background:var(--soft)}
.chip.ok{background:var(--good);color:var(--good-ink)}
.chip.err{background:var(--bad);color:#fff}
details{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
summary{cursor:pointer;padding:12px 0;font-weight:600}
details ul{list-style:none;margin:0;padding:0 0 10px;display:grid;gap:6px;font-size:16px}
details li{display:flex;justify-content:space-between;gap:12px}
details li span:last-child{color:var(--muted);text-align:right}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;color:var(--muted)}

/* words list */
.searchbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0 10px}
.searchbar .field{position:relative}
.searchbar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchbar input{padding-left:46px;padding-right:46px}
.searchbar .clear{position:absolute;right:2px;top:4px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:inherit;cursor:pointer}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0;display:grid}
.row-main b{font:700 21px/1.15 var(--font-display)}
.row-main span{color:var(--muted);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:5px;height:16px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--good)}
.grp{font:600 13.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 2px 8px}

/* study session */
.sess{display:flex;flex-direction:column;flex:1;min-height:0}
.sess-top{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.prog{flex:1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:var(--cta);transition:width .25s}
.sess-body{flex:1;min-height:0;overflow-y:auto;padding:6px 0 14px}
.sess-actions{padding:10px 0 calc(14px + env(safe-area-inset-bottom));display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plate{position:relative;display:flex;flex-direction:column;min-height:230px;padding:18px 22px 20px;border-radius:20px;background:var(--enamel);color:var(--enamel-ink);box-shadow:0 10px 26px -14px rgba(5,15,40,.7)}
.plate::before{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.88);border-radius:14px;pointer-events:none}
.plate-top{position:relative;display:flex;align-items:center;gap:8px;min-height:44px}
.plate-top .grow{flex:1}
.plate .fr{position:relative;font:700 var(--fr-size,52px)/1.04 var(--font-display);margin:auto 0;padding:14px 0;word-break:break-word}
.plate-foot{position:relative;font:600 13px var(--font-body);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.answer{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.answer .es{font:700 34px/1.12 var(--font-display)}
.answer .ex{display:grid;gap:3px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:17px}
.answer .ex [lang="fr"]{color:var(--ink)}
.verdict{display:flex;align-items:center;gap:8px;font:700 19px var(--font-display);margin-bottom:8px}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--bad)}
.verdict small{font:500 15px var(--font-body);color:var(--muted)}
.prompt{color:var(--muted);text-align:center;padding:20px 8px}
.sum{padding:24px 0}
.sum .big{font:700 88px/1 var(--font-display);margin:14px 0 0;font-variant-numeric:tabular-nums}
.sum .big span{font-size:44px;color:var(--muted)}

/* section switch */
#sections{flex:none;padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
#sections .seg button{font-size:15.5px;padding:12px 6px}
body.has-sw #view{padding-top:0}
body.has-sw .head{padding-top:16px}

/* grammar: lesson list */
.gprog{display:flex;align-items:center;gap:12px;margin-top:2px}
.gprog .prog{flex:1}
.cont{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:14px 16px;border:0;border-radius:16px;background:var(--enamel);color:var(--enamel-ink);text-align:left;cursor:pointer;box-shadow:0 8px 22px -14px rgba(5,15,40,.8)}
.cont small{display:block;font:600 12.5px var(--font-body);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.cont b{display:block;font:700 22px/1.15 var(--font-display);margin-top:2px}
.cont span.go{margin-left:auto;flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--signal);color:var(--signal-ink)}
.gfilter{margin-top:10px}
.lrow .ck{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);font:700 16px var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums}
.lrow .ck.on{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.lrow .chev{flex:none;color:var(--muted)}
.lrow .row-main span{white-space:normal}
.lrow .snip{font-size:15px;line-height:1.35}
mark{background:var(--signal);color:var(--signal-ink);border-radius:3px;padding:0 2px}

/* grammar: reader */
.rd-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px 6px;background:var(--bg);border-bottom:1px solid var(--line)}
.rd-pos{font:600 15px var(--font-body);color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-done{display:inline-flex;align-items:center;gap:6px;font:700 14px var(--font-display);letter-spacing:.04em;text-transform:uppercase;color:var(--good)}
.rd-title{padding:18px 0 4px}
.rd-title h1{font-size:32px}
.rd-title .frt{color:var(--muted);font-size:18px;margin-top:6px}
.keybox{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--enamel);color:var(--enamel-ink);font-size:18px;line-height:1.4;font-weight:500}
.keybox small{display:block;font:600 12.5px var(--font-body);letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.keybox .f{background:rgba(255,255,255,.16);color:inherit}
.gh{font:700 20px/1.15 var(--font-display);margin:26px 0 8px;color:var(--ink)}
.gp{margin:10px 0 0;font-size:17px;line-height:1.5}
.gul{margin:8px 0 0;padding:0 0 0 22px;display:grid;gap:7px;font-size:17px;line-height:1.45}
.gul li::marker{color:var(--c-learn)}
.f{font-weight:600;background:var(--tint);border-radius:5px;padding:0 .22em;white-space:normal;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s{font-style:italic}
.exs{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.exr{display:flex;align-items:center;gap:8px;padding:10px 6px 10px 14px;border-bottom:1px solid var(--line)}
.exr:last-child{border-bottom:0}
.exr div{flex:1;min-width:0}
.exr .fr{font:600 18.5px/1.3 var(--font-body);color:var(--ink)}
.exr .es{margin-top:2px;font-size:15.5px;line-height:1.35;color:var(--muted)}
.exr .icon-btn{flex:none;color:var(--enamel)}
.tw{margin-top:12px;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background-color:var(--surface);background-image:linear-gradient(to right,var(--surface) 30%,rgba(0,0,0,0)),linear-gradient(to left,var(--surface) 30%,rgba(0,0,0,0)),radial-gradient(farthest-side at 0 50%,rgba(15,27,45,.28),rgba(0,0,0,0)),radial-gradient(farthest-side at 100% 50%,rgba(15,27,45,.28),rgba(0,0,0,0));background-position:0 0,100% 0,0 0,100% 0;background-repeat:no-repeat;background-size:34px 100%,34px 100%,12px 100%,12px 100%;background-attachment:local,local,scroll,scroll}
.gt{width:100%;border-collapse:collapse;font-size:16px;line-height:1.35}
.gt th{font:600 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 10px;background:var(--soft);white-space:nowrap}
.gt td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.gt td:first-child{font-weight:600}
.gt.pl td{font-weight:500;padding:9px 8px;white-space:nowrap}
.gt.pl tr:first-child td{border-top:0}
.gnote{margin-top:12px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--c-fam);background:var(--surface);font-size:16.5px;line-height:1.45}
.gnote b{display:block;font:700 12.5px var(--font-body);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;color:var(--muted)}
.gnote.tip{border-left-color:var(--signal)}
.gnote.warn{border-left-color:var(--bad);background:var(--warn-bg)}
.gnote.warn b{color:var(--bad)}
.rd-end{margin-top:30px;padding-top:20px;border-top:2px dashed var(--line);display:grid;gap:10px}
.rd-src{color:var(--muted);font-size:14px;line-height:1.4;padding:8px 2px 0}

/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(5,10,20,.55)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-h{font:700 26px/1.1 var(--font-display);margin-bottom:4px}
.edit-meta{color:var(--muted);font-size:14.5px;margin-top:14px}
