le mot ; la palabra ; nm ; Ce mot est difficile. ; Esta palabra es difícil.
la phrase ; la frase ; nf ; Cette phrase est facile. ; Esta frase es fácil.
la question ; la pregunta ; nf ; J'ai une question. ; Tengo una pregunta.
la réponse ; la respuesta ; nf ; La réponse est oui. ; La respuesta es sí.
l'e-mail ; el correo electrónico, el email ; nm ; J'écris un e-mail. ; Escribo un correo electrónico.

# Common verbs
être ; ser, estar ; v ; Je suis fatigué. ; Estoy cansado.
avoir ; tener, haber ; v ; J'ai deux frères. ; Tengo dos hermanos.
aller ; ir ; v ; Je vais au travail. ; Voy al trabajo.
faire ; hacer ; v ; Que fais-tu ? ; ¿Qué haces?
venir ; venir ; v ; Tu viens avec nous ? ; ¿Vienes con nosotros?
prendre ; coger, tomar ; v ; Je prends un café. ; Tomo un café.
vouloir ; querer ; v ; Je veux un thé. ; Quiero un té.
pouvoir ; poder ; v ; Je peux t'aider. ; Puedo ayudarte.
devoir ; deber, tener que ; v ; Je dois partir. ; Tengo que irme.
savoir ; saber ; v ; Je ne sais pas. ; No lo sé.
voir ; ver ; v ; Je vois la mer. ; Veo el mar.
dire ; decir ; v ; Que dites-vous ? ; ¿Qué dice usted?
parler ; hablar ; v ; Je parle français. ; Hablo francés.
manger ; comer ; v ; Nous mangeons à une heure. ; Comemos a la una.
boire ; beber ; v ; Je bois de l'eau. ; Bebo agua.
habiter ; vivir ; v ; J'habite à Madrid. ; Vivo en Madrid.
travailler ; trabajar ; v ; Je travaille dans un bureau. ; Trabajo en una oficina.
aimer ; gustar, querer ; v ; J'aime le café. ; Me gusta el café.
regarder ; mirar, ver ; v ; Je regarde par la fenêtre. ; Miro por la ventana.
écouter ; escuchar ; v ; J'écoute le professeur. ; Escucho al profesor.
lire ; leer ; v ; Je lis dans le métro. ; Leo en el metro.
écrire ; escribir ; v ; J'écris à mon frère. ; Escribo a mi hermano.
comprendre ; entender, comprender ; v ; Je ne comprends pas. ; No entiendo.
apprendre ; aprender ; v ; J'apprends le français. ; Aprendo francés.
acheter ; comprar ; v ; J'achète du pain. ; Compro pan.
donner ; dar ; v ; Donne-moi la clé. ; Dame la llave.
trouver ; encontrar ; v ; Je trouve ma clé. ; Encuentro mi llave.
chercher ; buscar ; v ; Je cherche la gare. ; Busco la estación.
penser ; pensar ; v ; Je pense à ma famille. ; Pienso en mi familia.
connaître ; conocer ; v ; Je connais ce restaurant. ; Conozco este restaurante.
ouvrir ; abrir ; v ; J'ouvre la porte. ; Abro la puerta.
fermer ; cerrar ; v ; Je ferme la fenêtre. ; Cierro la ventana.
commencer ; empezar, comenzar ; v ; Le cours commence à neuf heures. ; La clase empieza a las nueve.
finir ; terminar, acabar ; v ; Je finis à six heures. ; Termino a las seis.
partir ; irse, salir, marcharse ; v ; Je pars demain. ; Me voy mañana.
arriver ; llegar ; v ; J'arrive au bureau à neuf heures. ; Llego a la oficina a las nueve.
entrer ; entrar ; v ; J'entre dans le magasin. ; Entro en la tienda.
sortir ; salir ; v ; Je sors du bureau. ; Salgo de la oficina.
rentrer ; volver a casa, regresar ; v ; Je rentre à six heures. ; Vuelvo a casa a las seis.
rester ; quedarse ; v ; Je reste à la maison. ; Me quedo en casa.
dormir ; dormir ; v ; Je dors huit heures. ; Duermo ocho horas.
jouer ; jugar ; v ; Les enfants jouent dans le parc. ; Los niños juegan en el parque.
marcher ; caminar, andar ; v ; Je marche dans la rue. ; Camino por la calle.
attendre ; esperar ; v ; J'attends le bus. ; Espero el autobús.
appeler ; llamar ; v ; J'appelle ma mère. ; Llamo a mi madre.
répondre ; responder, contestar ; v ; Je réponds à la question. ; Respondo a la pregunta.
demander ; preguntar, pedir ; v ; Je demande l'addition. ; Pido la cuenta.
aider ; ayudar ; v ; Tu peux m'aider ? ; ¿Puedes ayudarme?
payer ; pagar ; v ; Je paie le billet. ; Pago el billete.
voyager ; viajar ; v ; J'aime voyager en train. ; Me gusta viajar en tren.
se lever ; levantarse ; v ; Je me lève à sept heures. ; Me levanto a las siete.
s'appeler ; llamarse ; v ; Je m'appelle Marie. ; Me llamo Marie.

# Common adjectives
grand / grande ; grande, alto, alta ; adj ; Mon frère est grand. ; Mi hermano es alto.
petit / petite ; pequeño, pequeña ; adj ; La maison est petite. ; La casa es pequeña.
bon / bonne ; bueno, buena ; adj ; Le café est bon. ; El café está bueno.
mauvais / mauvaise ; malo, mala ; adj ; Il fait mauvais temps. ; Hace mal tiempo.
beau / belle ; bonito, bonita, bello, guapo ; adj ; La ville est belle. ; La ciudad es bonita.
joli / jolie ; bonito, bonita, lindo ; adj ; Quelle jolie fleur ! ; ¡Qué flor tan bonita!
nouveau / nouvelle ; nuevo, nueva ; adj ; J'ai un nouveau téléphone. ; Tengo un móvil nuevo.
vieux / vieille ; viejo, vieja ; adj ; Ma voiture est vieille. ; Mi coche es viejo.
jeune ; joven ; adj ; Mon frère est jeune. ; Mi hermano es joven.
content / contente ; contento, contenta ; adj ; Je suis content. ; Estoy contento.
heureux / heureuse ; feliz ; adj ; Elle est heureuse. ; Ella es feliz.
triste ; triste ; adj ; Il est triste aujourd'hui. ; Hoy está triste.
fatigué / fatiguée ; cansado, cansada ; adj ; Je suis fatigué après le travail. ; Estoy cansado después del trabajo.
malade ; enfermo, enferma ; adj ; Je suis malade. ; Estoy enfermo.
facile ; fácil ; adj ; Ce mot est facile. ; Esta palabra es fácil.
difficile ; difícil ; adj ; Cette phrase est difficile. ; Esta frase es difícil.
cher / chère ; caro, cara ; adj ; Le billet est cher. ; El billete es caro.
long / longue ; largo, larga ; adj ; La rue est longue. ; La calle es larga.
court / courte ; corto, corta ; adj ; Le cours est court. ; La clase es corta.
gentil / gentille ; amable, simpático, simpática ; adj ; Mon voisin est gentil. ; Mi vecino es amable.
prêt / prête ; listo, lista ; adj ; Le dîner est prêt. ; La cena está lista.
occupé / occupée ; ocupado, ocupada ; adj ; Je suis occupé aujourd'hui. ; Hoy estoy ocupado.
libre ; libre ; adj ; Cette place est libre. ; Este sitio está libre.
ouvert / ouverte ; abierto, abierta ; adj ; Le magasin est ouvert. ; La tienda está abierta.
fermé / fermée ; cerrado, cerrada ; adj ; La banque est fermée. ; El banco está cerrado.
plein / pleine ; lleno, llena ; adj ; Le métro est plein. ; El metro está lleno.
vide ; vacío, vacía ; adj ; Le bus est vide. ; El autobús está vacío.
chaud / chaude ; caliente, cálido ; adj ; Le café est chaud. ; El café está caliente.
froid / froide ; frío, fría ; adj ; L'eau est froide. ; El agua está fría.
important / importante ; importante ; adj ; C'est important. ; Es importante.
rapide ; rápido, rápida ; adj ; Le train est rapide. ; El tren es rápido.
lent / lente ; lento, lenta ; adj ; Le bus est lent. ; El autobús es lento.

# Little words
très ; muy ; adv ; Je suis très content. ; Estoy muy contento.
trop ; demasiado ; adv ; C'est trop cher. ; Es demasiado caro.
beaucoup ; mucho ; adv ; J'aime beaucoup ce livre. ; Me gusta mucho este libro.
peu ; poco, un poco ; adv ; Je parle un peu français. ; Hablo un poco de francés.
assez ; bastante ; adv ; Il est assez tard. ; Es bastante tarde.
plus ; más ; adv ; Un peu plus, s'il vous plaît. ; Un poco más, por favor.
moins ; menos ; adv ; Moins de sucre, s'il vous plaît. ; Menos azúcar, por favor.
bien ; bien ; adv ; Je vais bien. ; Estoy bien.
mal ; mal ; adv ; Je comprends mal. ; Entiendo mal.
ici ; aquí ; adv ; Je travaille ici. ; Trabajo aquí.
là ; allí, ahí ; adv ; La gare est là. ; La estación está allí.
aussi ; también ; adv ; Moi aussi. ; Yo también.
vite ; rápido, deprisa ; adv ; Il marche vite. ; Camina rápido.
ensemble ; juntos, juntas ; adv ; Nous travaillons ensemble. ; Trabajamos juntos.
seulement ; solo, solamente ; adv ; J'ai seulement dix euros. ; Solo tengo diez euros.
tout ; todo ; pron ; Tout est prêt. ; Todo está listo.
à ; a, en ; prep ; Je vais à Paris. ; Voy a París.
de ; de, desde ; prep ; Je viens de Madrid. ; Vengo de Madrid.
dans ; en, dentro de ; prep ; Le livre est dans le sac. ; El libro está en el bolso.
sur ; sobre, en ; prep ; Les clés sont sur la table. ; Las llaves están sobre la mesa.
sous ; debajo de, bajo ; prep ; Le chat est sous le lit. ; El gato está debajo de la cama.
avec ; con ; prep ; Je travaille avec mon frère. ; Trabajo con mi hermano.
sans ; sin ; prep ; Un café sans sucre. ; Un café sin azúcar.
pour ; para, por ; prep ; Un cadeau pour ma mère. ; Un regalo para mi madre.
chez ; en casa de ; prep ; Je vais chez mon ami. ; Voy a casa de mi amigo.
entre ; entre ; prep ; La banque est entre la gare et l'école. ; El banco está entre la estación y la escuela.
devant ; delante de ; prep ; Le bus est devant la gare. ; El autobús está delante de la estación.
derrière ; detrás de ; prep ; Le parc est derrière l'école. ; El parque está detrás de la escuela.
près de ; cerca de ; prep ; La banque est près de la gare. ; El banco está cerca de la estación.
loin de ; lejos de ; prep ; L'aéroport est loin de la ville. ; El aeropuerto está lejos de la ciudad.
à côté de ; al lado de ; prep ; La pharmacie est à côté de la banque. ; La farmacia está al lado del banco.
avant ; antes de ; prep ; Avant le travail, je lis. ; Antes del trabajo, leo.
après ; después de ; prep ; Après le travail, je rentre. ; Después del trabajo, vuelvo a casa.
en ; en ; prep ; Je vais au travail en métro. ; Voy al trabajo en metro.
et ; y ; conj ; Du pain et du fromage. ; Pan y queso.
ou ; o ; conj ; Thé ou café ? ; ¿Té o café?
mais ; pero ; conj ; Je comprends, mais je parle peu. ; Entiendo, pero hablo poco.
donc ; así que, por lo tanto ; conj ; Il pleut, donc je prends le bus. ; Llueve, así que cojo el autobús.
si ; si ; conj ; Si tu veux. ; Si quieres.
le / la / les ; el, la, los, las ; det ; Le livre, la clé, les stylos. ; El libro, la llave, los bolígrafos.
des ; unos, unas ; det ; Je mange des fruits. ; Como fruta.
mon / ma / mes ; mi, mis ; det ; Ma sœur s'appelle Claire. ; Mi hermana se llama Claire.
ton / ta / tes ; tu, tus ; det ; Où est ton sac ? ; ¿Dónde está tu bolso?
son / sa / ses ; su, sus ; det ; Son père est médecin. ; Su padre es médico.
notre / nos ; nuestro, nuestra, nuestros, nuestras ; det ; Notre maison est grande. ; Nuestra casa es grande.
votre / vos ; vuestro, vuestra, su (de usted) ; det ; Votre café, monsieur. ; Su café, señor.
leur / leurs ; su, sus (de ellos) ; det ; Leur fils est jeune. ; Su hijo es joven.
ce / cette ; este, esta, ese, esa ; det ; Cette ville est belle. ; Esta ciudad es bonita.

# Useful phrases
ça va ? ; ¿qué tal?, ¿cómo estás? ; expr ; Ça va ? Oui, ça va bien. ; ¿Qué tal? Sí, bien.
comment allez-vous ? ; ¿cómo está usted? ; expr ; Bonjour madame, comment allez-vous ? ; Buenos días, señora, ¿cómo está usted?
je m'appelle… ; me llamo… ; expr ; Je m'appelle Ana. ; Me llamo Ana.
je ne comprends pas ; no entiendo ; expr ; Pardon, je ne comprends pas. ; Perdón, no entiendo.
je ne sais pas ; no lo sé, no sé ; expr ; Je ne sais pas où est la gare. ; No sé dónde está la estación.
parlez-vous anglais ? ; ¿habla usted inglés? ; expr ; Excusez-moi, parlez-vous anglais ? ; Disculpe, ¿habla usted inglés?
pouvez-vous répéter ? ; ¿puede repetir? ; expr ; Pardon, pouvez-vous répéter ? ; Perdón, ¿puede repetir?
je voudrais… ; quisiera…, me gustaría… ; expr ; Je voudrais un billet. ; Quisiera un billete.
combien ça coûte ? ; ¿cuánto cuesta? ; expr ; Combien ça coûte, le billet ? ; ¿Cuánto cuesta el billete?
où est… ? ; ¿dónde está…? ; expr ; Où est la station de métro ? ; ¿Dónde está la estación de metro?
il y a ; hay ; expr ; Il y a un bus à huit heures. ; Hay un autobús a las ocho.
c'est ; es, esto es ; expr ; C'est facile. ; Es fácil.
il fait chaud ; hace calor ; expr ; Aujourd'hui, il fait chaud. ; Hoy hace calor.
il fait froid ; hace frío ; expr ; Demain, il fait froid. ; Mañana hace frío.
il pleut ; llueve ; expr ; Il pleut, prends ton manteau. ; Llueve, coge tu abrigo.
j'ai faim ; tengo hambre ; expr ; J'ai faim, je mange un sandwich. ; Tengo hambre, me como un bocadillo.
j'ai soif ; tengo sed ; expr ; J'ai soif, je bois de l'eau. ; Tengo sed, bebo agua.
à quelle heure ? ; ¿a qué hora? ; expr ; À quelle heure part le train ? ; ¿A qué hora sale el tren?
je suis en retard ; llego tarde, voy con retraso ; expr ; Excusez-moi, je suis en retard. ; Disculpe, llego tarde.
bon appétit ; buen provecho ; expr ; Bon appétit ! ; ¡Buen provecho!
bonne chance ; buena suerte ; expr ; Bonne chance pour demain ! ; ¡Buena suerte para mañana!</script>
<script type="application/json" id="gdata">{"parts":[{"id":"p1","title":"The basics","sub":"Pronouns, être, avoir, questions, negation","lessons":[{"id":"pronouns","en":"Subject pronouns","fr":"Les pronoms sujets","src":["EN"],"key":"Almost every French verb needs a subject pronoun in front of it. Spanish can drop it, French cannot.","blocks":[{"t":"h","x":"The pronouns"},{"t":"table","rows":[["","singular","plural"],["1st person","je (j')","nous"],["2nd person","tu","vous"],["3rd person","il / elle / on","ils / elles"]]},{"t":"ul","items":["{{je}} becomes {{j'}} before a vowel or a silent h: {{j'habite}}, {{j'adore}}.","{{ils}} is for a group of men or a mixed group. {{elles}} is only for an all-female group."]},{"t":"ex","items":[["Elles parlent chinois.","Ellas hablan chino."],["J'habite à Paris.","Vivo en París."]]},{"t":"note","k":"es","x":"In Spanish you can say [[hablo]] without [[yo]]. French always needs the pronoun: {{je parle}}, never just {{parle}}."},{"t":"h","x":"Tu or vous?"},{"t":"ul","items":["{{tu}}: family, friends, children, people you know well.","{{vous}}: one person you do not know well (polite, like [[usted]]) or several people (like [[vosotros]] / [[ustedes]])."]},{"t":"ex","items":[["Paul, Alice, vous aimez le chocolat ?","Paul, Alice, ¿os gusta el chocolate?"],["Pardon, madame, vous êtes française ?","Perdone, señora, ¿es usted francesa?"]]},{"t":"h","x":"On"},{"t":"p","x":"{{on}} uses the same verb form as {{il}} and is always singular. In everyday speech it replaces {{nous}}. It can also mean \"people in general\" or \"someone\"."},{"t":"ex","items":[["Marion et moi, on habite à Lyon.","Marion y yo vivimos en Lyon."],["En France, on achète beaucoup sur Internet.","En Francia se compra mucho por Internet."],["On a téléphoné pour toi.","Han llamado por ti."]]}]},{"id":"etre","en":"Être (to be)","fr":"Le verbe être","src":["EN"],"key":"{{être}} covers both [[ser]] and [[estar]]. It is also the helper verb for some past tenses.","blocks":[{"t":"h","x":"Present"},{"t":"table","rows":[["","singular","plural"],["1st person","je suis","nous sommes"],["2nd person","tu es","vous êtes"],["3rd person","il / elle / on est","ils / elles sont"]]},{"t":"h","x":"What it is used for"},{"t":"ul","items":["Who you are, nationality, profession, description.","Where and when something is."]},{"t":"ex","items":[["Je suis étudiante.","Soy estudiante."],["Ils sont italiens.","Son italianos."],["Vous êtes très gentille !","¡Es usted muy amable!"],["Nous sommes le douze mars.","Estamos a doce de marzo."],["Je suis à la maison.","Estoy en casa."]]},{"t":"note","k":"es","x":"Both [[ser]] and [[estar]] become {{être}}: {{Il est fatigué}} ([[Está cansado]]), {{Il est médecin}} ([[Es médico]]). No profession article is needed, just like in Spanish."},{"t":"note","k":"tip","x":"Do not mix up {{ils sont}} (no liaison) and {{ils ont}} (to have, with a [z] sound)."}]},{"id":"avoir","en":"Avoir (to have)","fr":"Le verbe avoir","src":["GP","EN"],"key":"{{avoir}} expresses possession, family, age, physical features, and is the usual helper verb for the past.","blocks":[{"t":"h","x":"Present"},{"t":"table","rows":[["","singular","plural"],["1st person","j'ai","nous avons"],["2nd person","tu as","vous avez"],["3rd person","il / elle / on a","ils / elles ont"]]},{"t":"h","x":"Uses"},{"t":"ex","items":[["J'ai une moto.","Tengo una moto."],["Elle a deux frères.","Tiene dos hermanos."],["Il a vingt ans.","Tiene veinte años."],["Il a les yeux verts.","Tiene los ojos verdes."]]},{"t":"ul","items":["Age uses {{avoir}}, never {{être}}: {{J'ai trente ans}}.","Physical features use {{avoir}} + {{les}}: {{les yeux}}, {{les cheveux}}."]},{"t":"note","k":"warn","x":"Liaison: {{vous avez}} and {{ils ont}} are pronounced with a [z] link. {{ils sont}} has no [z]."}]},{"id":"sensations","en":"Feelings and aches","fr":"Les sensations","src":["GP"],"key":"In French you \"have\" hunger, thirst, cold and pain. You are not hungry, you {{ai faim}}.","blocks":[{"t":"h","x":"Lack and need: avoir + noun"},{"t":"table","rows":[["French","Spanish"],["avoir faim","tener hambre"],["avoir soif","tener sed"],["avoir chaud","tener calor"],["avoir froid","tener frío"],["avoir sommeil","tener sueño"],["avoir peur (de)","tener miedo (de)"],["avoir besoin (de)","necesitar"],["avoir envie (de)","tener ganas de"]]},{"t":"ex","items":[["Vous avez chaud ?","¿Tiene calor?"],["Les enfants ont faim.","Los niños tienen hambre."],["J'ai envie d'un café.","Me apetece un café."]]},{"t":"note","k":"warn","x":"Say {{Vous avez chaud ?}}. Do not say {{Vous êtes chaud ?}}."},{"t":"h","x":"Pain: avoir mal à"},{"t":"p","x":"Use {{à}} + the body part with its article. Remember the contractions: {{à + le = au}}, {{à + les = aux}}."},{"t":"ex","items":[["J'ai mal à la tête.","Me duele la cabeza."],["Il a mal au dos.","Le duele la espalda."],["Elle a mal aux pieds.","Le duelen los pies."]]},{"t":"note","k":"warn","x":"Say {{J'ai mal aux pieds}}. Do not say {{j'ai mal à mes pieds}}."},{"t":"note","k":"es","x":"Spanish uses [[doler]] with the body part as subject ([[me duele la cabeza]]). French turns it into \"I have pain at the head\"."}]},{"id":"questions","en":"Asking questions","fr":"L'interrogation","src":["GP","EN"],"key":"Three easy ways to ask: raise your voice, add {{est-ce que}}, or use a question word.","blocks":[{"t":"h","x":"Yes/no questions"},{"t":"ul","items":["Intonation: say the statement and raise your voice at the end.","{{Est-ce que}} + a normal statement. Before a vowel it becomes {{est-ce qu'}}."]},{"t":"ex","items":[["Vous êtes japonais ?","¿Es usted japonés?"],["Est-ce que vous êtes japonais ?","¿Es usted japonés?"],["Est-ce qu'elle a faim ?","¿Tiene hambre?"]]},{"t":"ul","items":["The answer is closed: {{oui}}, {{non}}, {{un peu}}, {{je ne sais pas}}."]},{"t":"h","x":"Open questions"},{"t":"ul","items":["{{Qu'est-ce que}} + statement asks \"what?\": the answer can be anything."]},{"t":"ex","items":[["Qu'est-ce que tu fais demain ?","¿Qué haces mañana?"]]},{"t":"ul","items":["Other question words usually go at the start, then {{est-ce que}} or inversion in fixed phrases."]},{"t":"table","rows":[["Word","Meaning","Example"],["qui","quién","Qui est-ce ?"],["que / qu'est-ce que","qué","Qu'est-ce que c'est ?"],["où","dónde","Tu habites où ?"],["quand","cuándo","Quand part le train ?"],["comment","cómo","Comment allez-vous ?"],["pourquoi","por qué","Pourquoi tu pleures ?"],["combien","cuánto","Combien ça coûte ?"]]},{"t":"note","k":"tip","x":"In everyday French the question word often comes at the end: {{Tu habites où ?}} is perfectly normal."},{"t":"note","k":"es","x":"Spanish always writes [[¿...?]]. French only uses the final {{?}}, with a space before it."}]},{"id":"negation","en":"Negation","fr":"La négation","src":["GP","EN"],"key":"French negation has two parts around the verb: {{ne}} ... {{pas}}.","blocks":[{"t":"h","x":"The basic pattern"},{"t":"p","x":"{{ne}} goes before the verb, {{pas}} after it. {{ne}} becomes {{n'}} before a vowel."},{"t":"ex","items":[["Je ne suis pas content.","No estoy contento."],["Il n'est pas riche.","No es rico."],["Nous n'avons pas faim.","No tenemos hambre."]]},{"t":"note","k":"es","x":"Spanish has one word ([[no]]). French has two. In fast speech French people often drop {{ne}}, but write it."},{"t":"h","x":"Other negations"},{"t":"p","x":"Replace {{pas}} with another word. They all wrap the verb in the same way."},{"t":"table","rows":[["Pattern","Meaning","Example"],["ne ... pas","no, not","Je ne mange pas de viande."],["ne ... jamais","nunca","Tu ne viens jamais avec nous."],["ne ... rien","nada","Je ne vois rien."],["ne ... plus","ya no","Il ne travaille plus ici."],["ne ... pas encore","todavía no","Je ne le connais pas encore."]]},{"t":"note","k":"warn","x":"Do not combine {{pas}} with {{jamais}}, {{rien}} or {{plus}}. Use one of them only."},{"t":"h","x":"Negation and articles"},{"t":"ul","items":["Definite articles stay the same: {{le}}, {{la}}, {{les}}.","Indefinite and partitive articles ({{un}}, {{une}}, {{des}}, {{du}}, {{de la}}) all become {{de}} (or {{d'}})."]},{"t":"ex","items":[["Il a la télévision. Il n'a pas la télévision.","Tiene televisión. No tiene televisión."],["J'ai une voiture. Je n'ai pas de voiture.","Tengo coche. No tengo coche."],["Vous avez des enfants ? Non, nous n'avons pas d'enfants.","¿Tienen hijos? No, no tenemos hijos."],["Je ne mets pas d'huile.","No pongo aceite."]]}]},{"id":"cest","en":"C'est or il est?","fr":"Identifier et décrire","src":["GP","EN"],"key":"{{c'est}} identifies. {{il est}} / {{elle est}} describes.","blocks":[{"t":"h","x":"Identify with c'est and ce sont"},{"t":"ul","items":["{{C'est}} + singular noun, {{ce sont}} + plural noun.","Ask with {{Qui est-ce ?}} (people) and {{Qu'est-ce que c'est ?}} (things)."]},{"t":"ex","items":[["Qui est-ce ? C'est une amie.","¿Quién es? Es una amiga."],["Qu'est-ce que c'est ? C'est un cadeau.","¿Qué es? Es un regalo."],["Ce sont des amis.","Son amigos."],["Ce n'est pas un livre.","No es un libro."],["Ce ne sont pas des tulipes.","No son tulipanes."]]},{"t":"h","x":"Describe with il est, elle est, ils sont, elles sont"},{"t":"p","x":"After these pronouns come an adjective, a nationality or a profession without an article."},{"t":"ex","items":[["Il est grand.","Es alto."],["Elle est médecin.","Es médica."],["Ils sont irlandais.","Son irlandeses."],["C'est un sac. Il est grand.","Es una bolsa. Es grande."]]},{"t":"h","x":"Comments with c'est + adjective"},{"t":"p","x":"{{c'est}} + masculine adjective gives a general opinion about something in general."},{"t":"ex","items":[["La mer, c'est beau !","¡El mar es bonito!"],["Une rose, c'est beau.","Una rosa es bonita."],["Elle est belle, cette rose.","Esta rosa es bonita."]]},{"t":"note","k":"warn","x":"Say {{La mer, c'est beau}}. Do not say {{La mer, c'est belle}}."}]}]},{"id":"p2","title":"Nouns and little words","sub":"Articles, adjectives, pronouns, numbers","lessons":[{"id":"gender","en":"Gender and plural of nouns","fr":"Le nom : genre et nombre","src":["GP","EN"],"key":"Every noun is masculine or feminine, singular or plural, and it always comes with a small word in front (article, possessive...).","blocks":[{"t":"h","x":"Gender"},{"t":"ul","items":["Gender is mostly arbitrary: {{le taxi}}, {{la voiture}}, {{le monument}}. Learn each noun with its article.","For people and many animals the feminine is often made by adding {{-e}}: {{un ami}} → {{une amie}}.","Nouns already ending in {{-e}} often keep the same form: {{un élève}} / {{une élève}}, {{un touriste}} / {{une touriste}}.","Some endings change: {{-eur}} → {{-euse}} or {{-trice}}; {{-ien}} → {{-ienne}}."]},{"t":"ex","items":[["un chanteur → une chanteuse","un cantante → una cantante"],["un acteur → une actrice","un actor → una actriz"],["un étudiant → une étudiante","un estudiante → una estudiante"]]},{"t":"h","x":"Endings that help you guess"},{"t":"table","rows":[["Usually feminine","Usually masculine"],["-sion, -tion, -xion: la passion, la nation","-eau: le tableau, le bateau"],["-té, -ette: l'université, la baguette","-teur: le directeur, le moteur"],["-ure, -ance, -ence: la voiture, la chance","-isme: le tourisme, le racisme"],["","-ment: le monument, le vêtement"]]},{"t":"note","k":"es","x":"Not everything matches Spanish: [[el problema]] is {{le problème}} (m), but [[la sal]] is {{le sel}} (m) and [[el mar]] can be {{la mer}} (f). Check each new noun."},{"t":"h","x":"Plural"},{"t":"ul","items":["Normally add {{-s}} (silent): {{la boutique}} → {{les boutiques}}.","Nouns ending in {{-s}}, {{-x}}, {{-z}} do not change: {{le bus}} → {{les bus}}.","{{-eau}} → {{-eaux}}: {{le tableau}} → {{les tableaux}}.","{{-al}} → {{-aux}}: {{le journal}} → {{les journaux}}."]},{"t":"note","k":"warn","x":"The plural {{-s}} is not pronounced. You hear the plural from the article ({{le}} / {{les}}), not from the noun."}]},{"id":"articles","en":"The articles: le, un, du","fr":"Les articles","src":["GP","EN"],"key":"Definite {{le/la/les}} points to something specific or general. Indefinite {{un/une/des}} introduces something new or one among many.","blocks":[{"t":"h","x":"Overview"},{"t":"table","rows":[["","masculine","feminine","plural"],["definite","le (l')","la (l')","les"],["indefinite","un","une","des"],["partitive","du","de la","des"]]},{"t":"ul","items":["Before a vowel or a silent h, {{le}} and {{la}} become {{l'}}: {{l'école}}, {{l'hôtel}}. In the same way {{du}} and {{de la}} become {{de l'}}: {{de l'eau}}."]},{"t":"h","x":"Indefinite: un, une, des"},{"t":"p","x":"Use them for something not yet known, or one among many. {{des}} is the plural of {{un}} and {{une}}."},{"t":"ex","items":[["C'est un copain de Fred.","Es un amigo de Fred."],["C'est une chanteuse canadienne.","Es una cantante canadiense."],["À Paris, il y a des musées intéressants.","En París hay museos interesantes."]]},{"t":"h","x":"Definite: le, la, les"},{"t":"p","x":"Use them for something unique, already known, specific, or general (also for tastes)."},{"t":"ex","items":[["C'est le président de la République.","Es el presidente de la República."],["J'aime les croissants.","Me gustan los cruasanes."],["La mode, c'est important.","La moda es importante."],["Le Louvre est à Paris.","El Louvre está en París."]]},{"t":"ul","items":["Most countries have a definite article: {{la France}}, {{le Brésil}}, {{les États-Unis}}."]},{"t":"note","k":"es","x":"In Spanish a general idea often takes the article too ([[me gusta el fútbol]]), and so does French ({{j'aime le foot}}). The difference: Spanish can drop [[unos]] / [[unas]], while French normally needs {{des}}: {{J'ai des amis}}."},{"t":"note","k":"warn","x":"After {{aimer}}, {{adorer}} and {{détester}} always use the definite article: {{J'aime les chats}}, not {{j'aime chats}}."},{"t":"h","x":"One example, two articles"},{"t":"ex","items":[["Il y a un restaurant dans ma rue. Le restaurant est excellent.","Hay un restaurante en mi calle. El restaurante es excelente."]]},{"t":"p","x":"First mention → {{un}}. Second mention (now known) → {{le}}."}]},{"id":"contracted","en":"à, de + article","fr":"Les articles contractés","src":["GP","EN"],"key":"{{à}} and {{de}} merge with {{le}} and {{les}}: {{au}}, {{aux}}, {{du}}, {{des}}.","blocks":[{"t":"table","rows":[["","+ le","+ la","+ l'","+ les"],["à","au","à la","à l'","aux"],["de","du","de la","de l'","des"]]},{"t":"ex","items":[["Je vais au cinéma.","Voy al cine."],["Je vais à la boulangerie.","Voy a la panadería."],["Il est à l'hôpital.","Está en el hospital."],["Je vais aux toilettes.","Voy al baño."],["C'est le fils du boulanger.","Es el hijo del panadero."],["Donne-moi les clés de la voiture.","Dame las llaves del coche."],["Voilà l'adresse de l'hôtel.","Aquí está la dirección del hotel."],["J'aime l'odeur des roses.","Me gusta el olor de las rosas."]]},{"t":"note","k":"warn","x":"The contraction is mandatory for {{le}} and {{les}} only. Never say {{à le}}, {{de le}}, {{à les}} or {{de les}}."},{"t":"note","k":"es","x":"Spanish only has [[al]] and [[del]]. French has four forms: {{au}}, {{aux}}, {{du}}, {{des}}."},{"t":"note","k":"tip","x":"{{des}} can be \"of the\" (plural contraction) or the plural of {{un}}. The sentence tells you which: {{les clés des voisins}} (of the) vs {{des clés}} (some keys)."}]},{"id":"partitive","en":"Partitive: du, de la, des","fr":"Les articles partitifs","src":["GP","EN"],"key":"Use {{du}}, {{de la}}, {{de l'}} for an unspecified portion of something you cannot count.","blocks":[{"t":"h","x":"Forms"},{"t":"table","rows":[["masculine","feminine","before a vowel"],["du pain","de la confiture","de l'eau"]]},{"t":"ul","items":["Plural uses {{des}}: {{des noisettes}}."]},{"t":"ex","items":[["Le matin, je mange du pain avec de la confiture.","Por la mañana como pan con mermelada."],["Je prends du café.","Tomo café."],["Tu as de l'argent ?","¿Tienes dinero?"]]},{"t":"h","x":"Definite or partitive?"},{"t":"table","rows":[["Idea","Article","Example"],["a general taste","le / la / les","J'aime le chocolat."],["a portion","du / de la / de l'","Je mange du chocolat."],["something countable","un / une / des","Je mange un chocolat."]]},{"t":"note","k":"es","x":"Spanish leaves it out ([[como pan]], [[bebo agua]]). French needs the partitive: {{Je mange du pain}}, {{Je bois de l'eau}}."},{"t":"note","k":"warn","x":"After a negation or an amount, {{du}}, {{de la}} and {{des}} become {{de}} (see the lesson on quantity)."}]},{"id":"quantity","en":"Quantities and \"de\"","fr":"Les quantités","src":["GP","EN"],"key":"After an amount word, the article disappears: you only keep {{de}} (or {{d'}}).","blocks":[{"t":"h","x":"Exact quantities and containers"},{"t":"ex","items":[["un kilo de bananes","un kilo de plátanos"],["un litre d'huile","un litro de aceite"],["une bouteille de vin","una botella de vino"],["une boîte de thon","una lata de atún"],["un paquet de chips","un paquete de patatas fritas"],["un pot de yaourt","un tarro de yogur"],["un morceau de fromage","un trozo de queso"],["une tranche de pain","una rebanada de pan"]]},{"t":"h","x":"Approximate quantities"},{"t":"table","rows":[["Word","Meaning","Example"],["beaucoup de","mucho/a/os/as","Il met beaucoup de sucre."],["trop de","demasiado/a","Elle a mangé trop de chocolat."],["assez de","bastante","Il y a assez de sel."],["un peu de","un poco de","Je prends un peu de lait."],["peu de","poco/a","Je mange peu de viande."],["pas de","nada de / ningún","Je ne mets pas de sucre."]]},{"t":"ex","items":[["Tu as mangé tous les chocolats ?","¿Te has comido todos los bombones?"]]},{"t":"ul","items":["Totality: {{tout le}}, {{toute la}}, {{tous les}}, {{toutes les}} + noun: {{tous les matins}}, {{toute la nuit}}."]},{"t":"note","k":"warn","x":"Do not say {{beaucoup des amis}}. Say {{beaucoup d'amis}}."},{"t":"note","k":"tip","x":"{{un peu}} is positive (\"a little, enough\"), {{peu}} is almost negative (\"very little\")."}]},{"id":"demonstratives","en":"This, that: ce, cet, cette, ces","fr":"Les adjectifs démonstratifs","src":["GP","EN"],"key":"They point out a person or thing, or a time that is close.","blocks":[{"t":"table","rows":[["","masculine","feminine"],["singular","ce / cet","cette"],["plural","ces","ces"]]},{"t":"ul","items":["{{cet}} is used before a masculine noun starting with a vowel or a silent h: {{cet hôtel}}, {{cet arbre}}."]},{"t":"ex","items":[["Regarde cette fille !","¡Mira a esa chica!"],["Ce chat est mignon.","Este gato es mono."],["Cet hôtel est très beau.","Este hotel es muy bonito."],["Ces voitures sont rapides.","Estos coches son rápidos."],["On sort cet après-midi ou ce soir ?","¿Salimos esta tarde o esta noche?"]]},{"t":"note","k":"es","x":"French has no [[este / ese / aquel]] distinction. {{ce}} covers all of them. If you must tell them apart, add {{-ci}} (near) or {{-là}} (far): {{ce livre-ci}}, {{ce livre-là}}."}]},{"id":"possessives","en":"My, your, his: mon, ma, mes","fr":"Les adjectifs possessifs","src":["GP","EN"],"key":"The possessive agrees with the thing owned, not with the owner.","blocks":[{"t":"table","rows":[["owner","masc.","fem.","plural"],["je","mon","ma","mes"],["tu","ton","ta","tes"],["il / elle / on","son","sa","ses"],["nous","notre","notre","nos"],["vous","votre","votre","vos"],["ils / elles","leur","leur","leurs"]]},{"t":"ex","items":[["C'est mon vélo.","Es mi bici."],["Ma sœur et son mari habitent à Nice.","Mi hermana y su marido viven en Niza."],["Tes parents sont gentils.","Tus padres son amables."],["Voici notre maison et vos clés.","Aquí está nuestra casa y vuestras llaves."],["Leurs enfants parlent français.","Sus hijos hablan francés."]]},{"t":"note","k":"warn","x":"Before a feminine noun that starts with a vowel use {{mon}}, {{ton}}, {{son}}: {{mon amie}}, {{ton école}}."},{"t":"note","k":"warn","x":"{{son}} / {{sa}} / {{ses}} depend on the noun, not on whether the owner is a man or a woman: {{sa voiture}} can be his or her car."},{"t":"note","k":"es","x":"The Spanish [[su]] / [[sus]] has the same ambiguity. French also has {{leur}} for [[su]] of several owners."}]},{"id":"adjectives","en":"Adjectives: agreement and place","fr":"Les adjectifs qualificatifs","src":["GP","EN"],"key":"Adjectives agree in gender and number with the noun, and usually come after it.","blocks":[{"t":"h","x":"Feminine"},{"t":"ul","items":["Normally add {{-e}}: {{joli}} → {{jolie}}, {{japonais}} → {{japonaise}}.","Adjectives that already end in {{-e}} do not change: {{calme}}, {{sympathique}}."]},{"t":"table","rows":[["Masculine ending","Feminine","Example"],["-ien","-ienne","italien → italienne"],["-on","-onne","breton → bretonne"],["-er","-ère","premier → première"],["-eux","-euse","heureux → heureuse"],["-eur","-euse","menteur → menteuse"],["-al","-ale","général → générale"],["-if","-ive","actif → active"],["-s","-sse (some)","gros → grosse"]]},{"t":"h","x":"Plural"},{"t":"ul","items":["Normally add {{-s}}: {{sympathique}} → {{sympathiques}}.","Already ends in {{-s}} or {{-x}}: no change ({{gris}}, {{heureux}}).","{{beau}} → {{beaux}}, {{général}} → {{généraux}}.","Colours that are really nouns stay invariable: {{des yeux marron}}, {{des chaussettes orange}}."]},{"t":"ex","items":[["un garçon grand, une fille grande","un chico alto, una chica alta"],["des amis sympathiques","amigos simpáticos"]]},{"t":"h","x":"Place of the adjective"},{"t":"ul","items":["Normally after the noun. Always after for nationality, colour and shape, and for long adjectives."]},{"t":"ex","items":[["une fille brune","una chica morena"],["un manga japonais","un manga japonés"],["une maison sympathique","una casa simpática"]]},{"t":"ul","items":["A few short, common adjectives go before: {{beau}}, {{joli}}, {{petit}}, {{grand}}, {{bon}}, {{mauvais}}, {{jeune}}, {{vieux}}, {{nouveau}}."]},{"t":"ex","items":[["une belle maison, un petit livre, une bonne idée","una casa bonita, un libro pequeño, una buena idea"]]},{"t":"note","k":"es","x":"Spanish puts the adjective after the noun almost always. French has a handful of short adjectives that go before. Learn them as a set."},{"t":"note","k":"tip","x":"{{beau}}, {{nouveau}}, {{vieux}} change before a vowel: {{un bel hôtel}}, {{un nouvel ami}}, {{un vieil arbre}}."}]},{"id":"quel","en":"Which? What? Quel, quelle","fr":"Les adjectifs interrogatifs","src":["EN"],"key":"{{quel}} asks about a noun and agrees with it.","blocks":[{"t":"table","rows":[["","masculine","feminine"],["singular","quel","quelle"],["plural","quels","quelles"]]},{"t":"ex","items":[["Il est quelle heure ?","¿Qué hora es?"],["Tu aimes quels films ?","¿Qué películas te gustan?"],["Quelle est votre nationalité ?","¿Cuál es su nacionalidad?"],["Quel âge avez-vous ?","¿Cuántos años tiene?"],["Vous prenez quelles chaussures ?","¿Qué zapatos coge?"]]},{"t":"note","k":"es","x":"{{quel}} translates both [[qué]] and [[cuál]] when followed by a noun or {{être}}."}]},{"id":"tonic","en":"Stressed pronouns: moi, toi","fr":"Les pronoms toniques","src":["EN"],"key":"{{moi}}, {{toi}}, {{lui}}... are used to stress a person and after prepositions. They never replace the subject pronoun.","blocks":[{"t":"table","rows":[["subject","tonic"],["je","moi"],["tu","toi"],["il","lui"],["elle","elle"],["nous","nous"],["vous","vous"],["ils","eux"],["elles","elles"]]},{"t":"h","x":"Uses"},{"t":"ul","items":["To stress the subject: {{Moi, j'adore danser. Et toi ?}}","To present yourself: {{Bonjour, c'est moi, Tania.}}","After prepositions ({{avec}}, {{chez}}, {{pour}}, {{sans}}, {{à}}...)."]},{"t":"ex","items":[["Tu habites chez tes parents ? Non, pas chez eux.","¿Vives con tus padres? No, con ellos no."],["J'habite avec elle.","Vivo con ella."],["À qui sont ces lunettes ? À moi.","¿De quién son estas gafas? Mías."],["Lui, il aime le sport.","Él, le gusta el deporte."]]},{"t":"note","k":"warn","x":"Always repeat the subject pronoun: {{Lui, il aime...}}, not {{Lui aime...}}."}]},{"id":"objpron","en":"Direct object pronouns: le, la, les","fr":"Les pronoms COD","src":["EN"],"key":"{{le}}, {{la}}, {{les}} replace a noun that was already mentioned, and go before the verb.","blocks":[{"t":"table","rows":[["subject","direct object"],["je","me (m')"],["tu","te (t')"],["il / elle","le / la (l')"],["nous","nous"],["vous","vous"],["ils / elles","les"]]},{"t":"ul","items":["{{me}}, {{te}}, {{nous}}, {{vous}} replace people only. {{le}}, {{la}}, {{les}} replace people or things.","They replace a noun with a definite article, a possessive or a demonstrative."]},{"t":"ex","items":[["Tu connais la copine d'Éric ? Oui, je la connais.","¿Conoces a la novia de Éric? Sí, la conozco."],["Tu veux du sucre ? Non, merci. Je le prends sans sucre.","¿Quieres azúcar? No, gracias. Lo tomo sin azúcar."],["Je les vois demain.","Los veo mañana."],["Je ne le connais pas.","No lo conozco."]]},{"t":"note","k":"warn","x":"The pronoun goes before the verb, not after: {{Je le vois}}, not {{Je vois le}}. Only in the affirmative imperative does it follow: {{Lis-le !}}"},{"t":"note","k":"es","x":"Same word order as Spanish ([[lo veo]])."}]},{"id":"relative","en":"Relative pronouns: qui, que, où","fr":"Les pronoms relatifs","src":["EN"],"key":"They join two sentences. {{qui}} is the subject, {{que}} is the object, {{où}} is a place or a time.","blocks":[{"t":"h","x":"Qui (subject)"},{"t":"p","x":"{{qui}} replaces the subject of the second part. It never changes."},{"t":"ex","items":[["Tu connais cette fille qui entre dans la boulangerie ?","¿Conoces a esa chica que entra en la panadería?"],["Stromae est un chanteur qui est très célèbre.","Stromae es un cantante que es muy famoso."]]},{"t":"h","x":"Que (object)"},{"t":"p","x":"{{que}} replaces the object. It becomes {{qu'}} before a vowel."},{"t":"ex","items":[["Stromae est un chanteur que j'adore.","Stromae es un cantante que adoro."],["C'est une ville qu'elle aime beaucoup.","Es una ciudad que le gusta mucho."]]},{"t":"h","x":"Où (place or time)"},{"t":"ex","items":[["Venise est la ville où Casanova est né.","Venecia es la ciudad donde nació Casanova."],["Le vendredi, c'est le jour où je finis à 16 h.","El viernes es el día en que termino a las 16 h."]]},{"t":"note","k":"tip","x":"Is there a subject right after the pronoun? Then use {{que}}: {{le livre que tu lis}}. No subject after it? Then {{qui}}: {{le livre qui est sur la table}}."},{"t":"note","k":"warn","x":"{{que}} becomes {{qu'}} before a vowel but {{qui}} never loses its {{i}}."}]},{"id":"numbers","en":"Numbers","fr":"Les nombres","src":["GP","EN"],"key":"Learn 0–20, the tens, and then the pattern for 70–99.","blocks":[{"t":"h","x":"0 to 20"},{"t":"table","rows":[["0 zéro","7 sept","14 quatorze"],["1 un","8 huit","15 quinze"],["2 deux","9 neuf","16 seize"],["3 trois","10 dix","17 dix-sept"],["4 quatre","11 onze","18 dix-huit"],["5 cinq","12 douze","19 dix-neuf"],["6 six","13 treize","20 vingt"]],"plain":1},{"t":"h","x":"Tens"},{"t":"table","rows":[["20 vingt","60 soixante"],["30 trente","70 soixante-dix"],["40 quarante","80 quatre-vingts"],["50 cinquante","90 quatre-vingt-dix"],["100 cent","1000 mille"]],"plain":1},{"t":"ul","items":["{{mille}} (1000) never takes an {{-s}}."]},{"t":"h","x":"How they are built"},{"t":"ul","items":["21, 31, 41, 51, 61 use {{et un}}: {{vingt et un}}, {{trente et un}}. Also {{soixante et onze}} (71).","Other numbers use a hyphen: {{vingt-deux}}, {{trente-cinq}}.","70–79 are built on 60: {{soixante-dix}}, {{soixante et onze}}, {{soixante-douze}}...","80–99 are built on 80 (\"four twenties\"): {{quatre-vingts}}, {{quatre-vingt-un}}, {{quatre-vingt-dix}}, {{quatre-vingt-onze}}..."]},{"t":"note","k":"warn","x":"{{quatre-vingts}} has an {{-s}} only when nothing follows it: {{quatre-vingts}} but {{quatre-vingt-trois}}. 81 and 91 take no {{et}}: {{quatre-vingt-un}}, {{quatre-vingt-onze}}."},{"t":"h","x":"Pronunciation"},{"t":"ul","items":["{{cinq}}, {{six}}, {{huit}}, {{dix}} before a vowel: liaison ({{dix ans}} = [dizã]).","Before a consonant the last sound is silent ({{six mois}} = [si mwa]).","Numbers do not change with the noun: {{quatre copains}}, {{douze ans}}, {{cinquante euros}}."]},{"t":"h","x":"Ordinal numbers"},{"t":"p","x":"Add {{-ième}} to the cardinal number: {{deuxième}}, {{troisième}}, {{quatrième}}. Exceptions: {{premier / première}} (1st) and {{second(e)}}."},{"t":"ex","items":[["Il habite au troisième étage.","Vive en el tercer piso."],["C'est ma deuxième fois ici.","Es mi segunda vez aquí."]]},{"t":"note","k":"tip","x":"In Belgium and Switzerland they often say {{septante}}, {{nonante}} instead of 70 and 90, and {{huitante}} (Swiss) for 80."}]},{"id":"weather","en":"The weather","fr":"Le temps","src":["GP"],"key":"Weather uses an impersonal {{il}}: {{il fait ...}}, {{il pleut}}, {{il neige}}.","blocks":[{"t":"table","rows":[["French","Spanish"],["Il fait chaud.","Hace calor."],["Il fait froid.","Hace frío."],["Il fait beau.","Hace buen tiempo."],["Il fait mauvais.","Hace mal tiempo."],["Il pleut.","Llueve."],["Il neige.","Nieva."],["Il y a du soleil.","Hay sol."],["Il y a du vent. / Il vente.","Hay viento."],["Il y a des nuages.","Hay nubes."]]},{"t":"ul","items":["With degrees: {{Il fait dix degrés.}}"]},{"t":"ex","items":[["Quel temps fait-il ? Il fait beau.","¿Qué tiempo hace? Hace buen tiempo."],["En hiver, il fait froid.","En invierno hace frío."]]},{"t":"note","k":"warn","x":"Say {{Il fait chaud}} for the weather. {{Je suis chaud}} means something else. For your own body say {{J'ai chaud}}."}]}]},{"id":"p3","title":"Places, time and reasons","sub":"Prepositions, il y a, days and months","lessons":[{"id":"place1","en":"à, de, chez, près de","fr":"Localisation : à, de, chez","src":["GP","EN"],"key":"{{à}} says where you are or go. {{de}} says where you come from. {{chez}} is \"at someone's place\".","blocks":[{"t":"h","x":"The basics"},{"t":"table","rows":[["Word","Use","Example"],["à + place","where you are / go","Je suis à Paris."],["de + place","where you come from","Dino est de Rome."],["chez + person","at someone's home","Je suis chez Pierre."],["près de","near","Nice est près de Marseille."],["loin de","far from","Paris est loin de Nice."],["à côté de","next to","La banque est à côté de la gare."]]},{"t":"ul","items":["{{à + le = au}}, {{à + les = aux}}; {{de + le = du}}, {{de + les = des}}. {{de}} becomes {{d'}} before a vowel: {{d'Istanbul}}."]},{"t":"ex","items":[["Je suis à la plage / à l'aéroport / au cinéma.","Estoy en la playa / en el aeropuerto / en el cine."],["Il vient de Tokyo.","Viene de Tokio."],["Tu viens dîner chez moi ? Non, je dîne chez ma mère.","¿Vienes a cenar a mi casa? No, ceno en casa de mi madre."]]},{"t":"note","k":"es","x":"Spanish uses [[a]] (go) or [[en]] (be). French uses {{à}} for both with a city. {{chez}} translates [[a casa de]] / [[en casa de]]."},{"t":"note","k":"tip","x":"{{chez}} also works for shops and professions: {{chez le boulanger}}, {{chez le médecin}}."}]},{"id":"place2","en":"Cities and countries: à, en, au","fr":"À, en, au + ville ou pays","src":["GP","EN"],"key":"Cities take {{à}}. Countries take {{en}}, {{au}} or {{aux}} depending on their gender and number.","blocks":[{"t":"h","x":"Where you go or where you are"},{"t":"table","rows":[["Place","Preposition","Example"],["city","à","à Paris, à Madrid"],["feminine country (ends in -e)","en","en France, en Colombie"],["masculine country starting with a vowel","en","en Iran, en Équateur"],["masculine country","au","au Brésil, au Japon, au Canada"],["plural country","aux","aux États-Unis"]]},{"t":"h","x":"Where you come from"},{"t":"table","rows":[["Place","Preposition","Example"],["city","de (d')","de Rome, d'Istanbul"],["feminine country / starts with a vowel","de (d')","de France, d'Iran"],["masculine country","du","du Liban, du Japon"],["plural country","des","des États-Unis"]]},{"t":"ex","items":[["J'habite en Espagne.","Vivo en España."],["Je vais au Mexique.","Voy a México."],["Elle vient de Jordanie ou d'Irak ?","¿Viene de Jordania o de Irak?"],["Son copain vient des États-Unis.","Su novio viene de Estados Unidos."]]},{"t":"note","k":"tip","x":"Almost every country ending in {{-e}} is feminine: {{la France}}, {{l'Espagne}}. Exception: {{le Mexique}}, {{le Cambodge}}, {{le Zimbabwe}}."}]},{"id":"place3","en":"In, on, under, in front of","fr":"dans, sur, sous, devant, derrière","src":["GP","EN"],"key":"Prepositions of place tell where something is relative to something else.","blocks":[{"t":"table","rows":[["Word","Meaning","Example"],["dans","dentro de, en","Les clés sont dans le sac."],["sur","sobre, en","Le livre est sur la table."],["sous","debajo de","Le chat est sous la chaise."],["devant","delante de","Le garçon est devant la maison."],["derrière","detrás de","Le chien est derrière la voiture."],["à côté de","al lado de","La poste est à côté de la banque."],["entre","entre","Le café est entre la banque et la poste."],["en face de","enfrente de","Le parc est en face de l'école."]]},{"t":"h","x":"Dans or sur?"},{"t":"ul","items":["{{dans}}: closed space ({{dans la rue}}, between buildings, {{dans ma chambre}}).","{{sur}}: open space ({{sur la place}}, {{sur le trottoir}}, {{sur la route}}, {{sur le quai}})."]},{"t":"ex","items":[["Elle est où, ta banque ? Elle est dans la rue du Louvre.","¿Dónde está tu banco? Está en la calle del Louvre."],["Elle est sur la place de la Victoire.","Está en la plaza de la Victoria."]]},{"t":"note","k":"tip","x":"With a street name you can drop the preposition: {{J'habite rue Victor Hugo}}. {{Dans la rue}} is used for \"the street\" in general."}]},{"id":"ilya","en":"There is, there are","fr":"Il y a","src":["GP"],"key":"{{il y a}} states that something exists. It never changes in the plural.","blocks":[{"t":"ex","items":[["Dans la rue, il y a un café.","En la calle hay un café."],["En Afrique, il y a des éléphants.","En África hay elefantes."],["Il y a du lait dans le frigo.","Hay leche en la nevera."],["Il n'y a pas de pain.","No hay pan."],["Est-ce qu'il y a une pharmacie près d'ici ?","¿Hay una farmacia cerca de aquí?"],["Qu'est-ce qu'il y a ?","¿Qué pasa?"]]},{"t":"ul","items":["After the negation, the article becomes {{de}}: {{Il n'y a pas de pain}}."]},{"t":"note","k":"warn","x":"After {{il y a}} use an indefinite article ({{un}}, {{des}}, {{du}}). For something already known use {{être}}: {{Il y a un livre sur la table}}, but {{Le livre est sur la table}}."},{"t":"note","k":"tip","x":"Don't confuse it with {{voilà}} (\"here is\") and {{c'est}} (identify)."}]},{"id":"directions","en":"Asking for and giving directions","fr":"Se situer, s'orienter","src":["EN"],"key":"{{Où est ...}} and {{Où se trouve ...}} are your key questions.","blocks":[{"t":"h","x":"Questions"},{"t":"table","rows":[["French","Spanish"],["Où est la gare, s'il vous plaît ?","¿Dónde está la estación, por favor?"],["Excusez-moi, je cherche la poste.","Perdone, busco correos."],["C'est loin d'ici ?","¿Está lejos de aquí?"],["Tu es où ?","¿Dónde estás?"],["Tu vas où ?","¿Adónde vas?"],["Tu viens d'où ?","¿De dónde vienes?"]]},{"t":"h","x":"Answers"},{"t":"table","rows":[["French","Spanish"],["C'est à gauche.","Está a la izquierda."],["C'est à droite.","Está a la derecha."],["Tout droit.","Todo recto."],["C'est tout près.","Está muy cerca."],["C'est assez loin.","Está bastante lejos."],["Elle est juste à côté.","Está justo al lado."],["Elles sont ici / là.","Están aquí / ahí."],["Elles sont là-bas.","Están allí."]]},{"t":"ex","items":[["Elle se trouve rue Jean Jaurès.","Está en la calle Jean Jaurès."],["Je vais au cinéma. J'habite à Paris.","Voy al cine. Vivo en París."]]}]},{"id":"transport","en":"Means of transport","fr":"Les moyens de transport","src":["EN"],"key":"Open means → {{à}} ({{à pied}}, {{à vélo}}). Closed vehicles → {{en}} ({{en bus}}, {{en voiture}}).","blocks":[{"t":"table","rows":[["à (open)","en (closed)"],["à pied","en métro"],["à vélo","en bus"],["à moto","en voiture"],["à cheval","en train"],["","en avion"]]},{"t":"ex","items":[["Je vais au travail à vélo.","Voy al trabajo en bici."],["Le jeudi, je vais au collège en bus.","Los jueves voy al colegio en autobús."]]},{"t":"note","k":"warn","x":"{{en avion}} = how you travel. {{dans l'avion}} = inside the plane (a place). {{Je voyage en avion. Je suis dans l'avion.}}"}]},{"id":"whywhy","en":"Why? Because: pourquoi, parce que, pour","fr":"Pourquoi, parce que, pour","src":["EN"],"key":"{{Pourquoi ?}} can be answered with a purpose ({{pour}} + infinitive) or a cause ({{parce que}} + sentence).","blocks":[{"t":"ex","items":[["Pourquoi tu apprends le français ? Pour travailler en France.","¿Por qué aprendes francés? Para trabajar en Francia."],["Pourquoi tu habites ici ? Parce que c'est moins cher.","¿Por qué vives aquí? Porque es más barato."]]},{"t":"ul","items":["{{pour}} + infinitive: goal.","{{parce que}} + subject + verb: cause. It becomes {{parce qu'}} before a vowel."]},{"t":"note","k":"warn","x":"At this level, don't start a sentence with {{parce que}}. Use it to answer {{Pourquoi ?}} or in the middle of a sentence."},{"t":"note","k":"es","x":"{{pourquoi}} = [[¿por qué?]]. {{parce que}} = [[porque]]. {{pour}} = [[para]]."}]},{"id":"calendar","en":"Days, months, seasons","fr":"Le calendrier","src":["EN"],"key":"French days and months are written with a small letter, and the week starts on Monday.","blocks":[{"t":"table","rows":[["Days","Months","Months"],["lundi","janvier","juillet"],["mardi","février","août"],["mercredi","mars","septembre"],["jeudi","avril","octobre"],["vendredi","mai","novembre"],["samedi","juin","décembre"],["dimanche","",""]]},{"t":"ul","items":["Seasons: {{le printemps}}, {{l'été}}, {{l'automne}}, {{l'hiver}}.","Preposition: {{en}} for months and seasons except spring ({{en juillet}}, {{en été}}, {{en hiver}}, but {{au printemps}})."]},{"t":"ex","items":[["Il fait chaud en août.","Hace calor en agosto."],["Au printemps, le beau temps revient.","En primavera vuelve el buen tiempo."],["Nous sommes le douze mars.","Estamos a doce de marzo."]]},{"t":"h","x":"The date"},{"t":"p","x":"{{le}} + number + month. Only the first of the month uses an ordinal: {{le premier avril}}, {{le deux avril}}."},{"t":"h","x":"Days of the week"},{"t":"table","rows":[["French","Meaning"],["dimanche","este domingo / el próximo"],["dimanche dernier","el domingo pasado"],["le dimanche","todos los domingos"],["le matin / l'après-midi / le soir","por la mañana / tarde / noche"]]},{"t":"ex","items":[["Qu'est-ce que tu fais dimanche ?","¿Qué haces el domingo?"],["Le dimanche, je me repose.","Los domingos descanso."]]},{"t":"note","k":"warn","x":"Do not say {{le dimanche}} when you mean this coming Sunday. Use {{dimanche}} alone."}]},{"id":"time","en":"Telling the time","fr":"L'heure","src":["EN"],"key":"Use {{il est}} + hour + {{heures}}; add {{et quart}}, {{et demie}}, {{moins le quart}}.","blocks":[{"t":"table","rows":[["French","Time"],["Il est une heure.","1:00"],["Il est six heures et quart.","6:15"],["Il est sept heures et demie.","7:30"],["Il est huit heures moins le quart.","7:45"],["Il est onze heures vingt.","11:20"],["Il est midi / minuit.","12:00 / 00:00"]]},{"t":"ul","items":["Everyday speech uses 12 hours; timetables use 24 hours ({{il est vingt heures quinze}})."]},{"t":"ex","items":[["Quelle heure est-il ?","¿Qué hora es?"],["Vous avez l'heure ?","¿Tiene hora?"],["Le film commence à vingt heures quinze.","La película empieza a las ocho y cuarto."],["À quelle heure tu pars ?","¿A qué hora te vas?"]]},{"t":"note","k":"warn","x":"Say {{une heure}} (singular) but {{deux heures}}, {{trois heures}} (plural)."}]},{"id":"timemark","en":"Past, present, future markers","fr":"Les marqueurs de temps","src":["EN"],"key":"Learn these little words to tell when something happens.","blocks":[{"t":"table","rows":[["Past","Present","Future"],["hier","aujourd'hui","demain"],["avant-hier","cette semaine","après-demain"],["la semaine dernière","ce mois-ci","la semaine prochaine"],["le mois dernier","cette année","le mois prochain"],["l'année dernière","en ce moment","l'année prochaine"],["il y a dix ans","","dans dix ans"]]},{"t":"ex","items":[["Hier, il a plu sans arrêt.","Ayer llovió sin parar."],["Aujourd'hui, il fait beau.","Hoy hace buen tiempo."],["Demain, nous partons.","Mañana nos vamos."]]},{"t":"h","x":"Order of actions"},{"t":"p","x":"{{d'abord}}, {{ensuite}}, {{après}}, {{enfin}}, {{finalement}} help organise a story."},{"t":"ex","items":[["D'abord, j'ai pris mon petit déjeuner. Ensuite, j'ai rangé ma chambre. Finalement, j'ai regardé un film.","Primero desayuné. Luego ordené mi habitación. Por último vi una película."]]},{"t":"h","x":"Frequency"},{"t":"table","rows":[["French","Meaning"],["toujours","siempre"],["souvent","a menudo"],["de temps en temps","de vez en cuando"],["rarement","raramente"],["ne ... jamais","nunca"],["deux fois par semaine","dos veces por semana"]]},{"t":"ex","items":[["Tu fais souvent du jogging ? Oui, de temps en temps.","¿Haces footing a menudo? Sí, de vez en cuando."]]}]},{"id":"duration","en":"pendant, depuis, il y a, de ... à","fr":"Durée et moment","src":["EN"],"key":"{{il y a}} points to a moment in the past. {{pendant}} gives the length of a finished action. {{depuis}} gives how long something has been going on up to now.","blocks":[{"t":"table","rows":[["Word","Idea","Example"],["il y a + time","a moment in the past","Ils se sont mariés il y a dix ans."],["pendant + time","a finished duration","Elle a habité à Lyon pendant cinq ans."],["depuis + time","a duration still going on","Ils sont mariés depuis dix ans."],["de ... à","start and end","Ils ont vécu à Beyrouth de 2005 à 2009."],["en + year","a particular year","Nous nous sommes rencontrés en 2010."]]},{"t":"ex","items":[["J'habite ici depuis deux ans.","Vivo aquí desde hace dos años."],["J'ai habité à Lyon pendant deux ans.","Viví en Lyon durante dos años."],["Je suis arrivé il y a une semaine.","Llegué hace una semana."]]},{"t":"note","k":"es","x":"Spanish [[hace dos años]] = {{il y a deux ans}} (a moment) or {{depuis deux ans}} (still going). Spanish [[desde hace]] = {{depuis}}."},{"t":"note","k":"warn","x":"{{depuis}} is used with the present: {{J'habite ici depuis deux ans}}, not the past."}]}]},{"id":"p4","title":"Verbs","sub":"Present, past, orders and useful verbs","lessons":[{"id":"erverbs","en":"Regular -er verbs","fr":"Les verbes en -er","src":["GP","EN"],"key":"Most French verbs end in {{-er}} and follow one pattern: remove {{-er}} and add the endings.","blocks":[{"t":"h","x":"Present of parler"},{"t":"table","rows":[["","singular","plural"],["1st person","je parle","nous parlons"],["2nd person","tu parles","vous parlez"],["3rd person","il / elle / on parle","ils / elles parlent"]]},{"t":"ul","items":["Endings: {{-e}}, {{-es}}, {{-e}}, {{-ons}}, {{-ez}}, {{-ent}}.","The singular and the {{ils / elles}} forms sound the same: [parl].","{{je}} becomes {{j'}} before a vowel or silent h: {{j'écoute}}, {{j'habite}}."]},{"t":"ex","items":[["Je regarde la télé.","Veo la tele."],["Tu écoutes de la musique.","Escuchas música."],["Nous habitons à Lyon.","Vivimos en Lyon."],["Ils travaillent beaucoup.","Trabajan mucho."]]},{"t":"table","rows":[["Common -er verbs","Spanish"],["parler","hablar"],["habiter","vivir"],["travailler","trabajar"],["manger","comer"],["regarder","mirar"],["écouter","escuchar"],["aimer","querer / gustar"],["étudier","estudiar"],["chercher","buscar"],["donner","dar"]]},{"t":"note","k":"warn","x":"{{aller}} ends in {{-er}} but is irregular (see the lesson on {{aller}})."},{"t":"note","k":"es","x":"Spanish gives every person its own sound. French has only three ([parl], [parlõ], [parle]), so the subject pronoun is always needed."}]},{"id":"spelling","en":"Spelling changes in -er verbs","fr":"Verbes en -er : changements","src":["EN"],"key":"Some -er verbs change a letter to keep their sound.","blocks":[{"t":"h","x":"manger and commencer"},{"t":"ul","items":["{{-ger}} adds an {{e}} before {{o}}: {{nous mangeons}}.","{{-cer}} changes {{c}} to {{ç}} before {{o}}: {{nous commençons}}."]},{"t":"table","rows":[["manger","commencer"],["je mange","je commence"],["tu manges","tu commences"],["il mange","il commence"],["nous mangeons","nous commençons"],["vous mangez","vous commencez"],["ils mangent","ils commencent"]]},{"t":"h","x":"acheter, préférer, appeler, essayer"},{"t":"p","x":"These verbs have two sounds in the present: one for je/tu/il/ils and one for nous/vous."},{"t":"table","rows":[["acheter","préférer","appeler","essayer"],["j'achète","je préfère","j'appelle","j'essaie"],["tu achètes","tu préfères","tu appelles","tu essaies"],["il achète","il préfère","il appelle","il essaie"],["nous achetons","nous préférons","nous appelons","nous essayons"],["vous achetez","vous préférez","vous appelez","vous essayez"],["ils achètent","ils préfèrent","ils appellent","ils essaient"]]},{"t":"ex","items":[["Je préfère le thé.","Prefiero el té."],["Nous achetons du pain.","Compramos pan."]]},{"t":"note","k":"tip","x":"The \"boot\" pattern: only {{je}}, {{tu}}, {{il}} and {{ils}} change; {{nous}} and {{vous}} keep the normal stem. Most verbs in {{-eler}} double the {{l}}."}]},{"id":"etre2","en":"Être and avoir: past forms","fr":"Être et avoir au passé","src":["EN"],"key":"{{être}} and {{avoir}} are auxiliary verbs: they build the compound past (passé composé) of other verbs.","blocks":[{"t":"table","rows":[["","être","avoir"],["present","je suis","j'ai"],["past participle","été","eu"],["passé composé","j'ai été","j'ai eu"]]},{"t":"ex","items":[["Hier, j'ai été malade.","Ayer estuve enfermo."],["Elle a eu un accident.","Ella tuvo un accidente."]]},{"t":"note","k":"warn","x":"Even {{être}} takes {{avoir}} in the passé composé: {{j'ai été}}, never {{je suis été}}."}]},{"id":"aller","en":"Aller and the near future","fr":"Le verbe aller et le futur proche","src":["EN"],"key":"{{aller}} means \"to go\". It is also the helper for the near future.","blocks":[{"t":"h","x":"Present"},{"t":"table","rows":[["","singular","plural"],["1st person","je vais","nous allons"],["2nd person","tu vas","vous allez"],["3rd person","il / elle / on va","ils / elles vont"]]},{"t":"ex","items":[["Je vais au cinéma.","Voy al cine."],["Comment allez-vous ?","¿Cómo está usted?"],["Nous allons à la plage.","Vamos a la playa."]]},{"t":"h","x":"Near future: aller + infinitive"},{"t":"ex","items":[["Je vais partir demain.","Me voy mañana."],["Il va pleuvoir.","Va a llover."],["On va manger ensemble ?","¿Comemos juntos?"]]},{"t":"note","k":"es","x":"This works exactly like Spanish [[ir a + infinitivo]]: {{Je vais manger}} = [[Voy a comer]]."},{"t":"note","k":"warn","x":"{{Comment ça va ?}} (How are you?) uses {{aller}} too: {{Ça va bien}}."}]},{"id":"faire","en":"Faire, dire, prendre","fr":"Faire, dire, prendre","src":["EN"],"key":"Three very frequent irregular verbs.","blocks":[{"t":"table","rows":[["","faire","dire","prendre"],["je","fais","dis","prends"],["tu","fais","dis","prends"],["il / elle / on","fait","dit","prend"],["nous","faisons","disons","prenons"],["vous","faites","dites","prenez"],["ils / elles","font","disent","prennent"]]},{"t":"ex","items":[["Qu'est-ce que tu fais demain ?","¿Qué haces mañana?"],["Il fait du sport.","Hace deporte."],["Tu dis la vérité.","Dices la verdad."],["Je prends le bus.","Cojo el autobús."]]},{"t":"ul","items":["{{faire}} is also used for weather ({{il fait beau}}), for sports and chores ({{faire du sport}}, {{faire la cuisine}}).","{{apprendre}} and {{comprendre}} follow the same pattern as {{prendre}}."]},{"t":"note","k":"warn","x":"{{vous faites}} and {{vous dites}} are the only {{vous}} forms that don't end in {{-ez}} (apart from {{vous êtes}})."}]},{"id":"venir","en":"Venir (to come)","fr":"Venir","src":["EN"],"key":"{{venir}} is irregular: three stems, like {{prendre}}.","blocks":[{"t":"table","rows":[["je viens","nous venons"],["tu viens","vous venez"],["il / elle / on vient","ils / elles viennent"]],"plain":1},{"t":"ex","items":[["Tu viens d'où ? Je viens d'Italie.","¿De dónde eres? Soy de Italia."],["Vous venez dîner chez nous ?","¿Vienen a cenar a nuestra casa?"]]},{"t":"note","k":"es","x":"{{venir de + place}} gives origin: {{Je viens de Madrid}} = [[Soy de Madrid]]."}]},{"id":"modals","en":"Can, want, must: pouvoir, vouloir, devoir","fr":"Pouvoir, vouloir, devoir","src":["EN"],"key":"These three verbs are followed by an infinitive.","blocks":[{"t":"table","rows":[["","pouvoir","vouloir","devoir"],["je","peux","veux","dois"],["tu","peux","veux","dois"],["il / elle / on","peut","veut","doit"],["nous","pouvons","voulons","devons"],["vous","pouvez","voulez","devez"],["ils / elles","peuvent","veulent","doivent"]]},{"t":"ex","items":[["Je peux entrer ?","¿Puedo entrar?"],["Je veux un café.","Quiero un café."],["Tu dois faire attention.","Tienes que tener cuidado."],["Vous devez partir à quelle heure ?","¿A qué hora tiene que irse?"]]},{"t":"h","x":"Polite request"},{"t":"ul","items":["{{Je voudrais ...}} is the polite way: {{Je voudrais un café, s'il vous plaît.}}","{{Je veux}} sounds very direct, so prefer {{je voudrais}} when you ask for something."]},{"t":"h","x":"Meanings of devoir"},{"t":"ul","items":["Obligation: {{Tu dois te dépêcher.}}","Negative = prohibition: {{Tu ne dois pas traverser seul.}}","With a noun = owing: {{Vous me devez 500 euros.}}"]},{"t":"note","k":"warn","x":"{{vouloir}} and {{pouvoir}} take no {{à}}/{{de}}: {{Je veux partir}}, never {{je veux de partir}}."}]},{"id":"savoir","en":"Savoir or connaître?","fr":"Savoir et connaître","src":["EN"],"key":"{{savoir}} = to know a fact or know how to do something. {{connaître}} = to be familiar with a person, place or thing.","blocks":[{"t":"table","rows":[["","savoir","connaître"],["je","sais","connais"],["tu","sais","connais"],["il / elle / on","sait","connaît"],["nous","savons","connaissons"],["vous","savez","connaissez"],["ils / elles","savent","connaissent"]]},{"t":"ex","items":[["Tu sais la nouvelle ?","¿Sabes la noticia?"],["Elle sait jouer du piano.","Sabe tocar el piano."],["Tu connais Alex ?","¿Conoces a Álex?"],["Vous connaissez cette chanson ?","¿Conoce esta canción?"]]},{"t":"ul","items":["{{savoir}} + infinitive: {{Je sais nager.}}","{{connaître}} + noun (a person, a place, a song...). Never + infinitive."]},{"t":"note","k":"warn","x":"Never say {{je connais nager}}. Use {{je sais nager}}."},{"t":"note","k":"es","x":"Same split as Spanish [[saber]] (facts, skills) and [[conocer]] (people, places)."}]},{"id":"ir","en":"Verbs ending in -ir","fr":"Verbes en -ir","src":["EN"],"key":"Many {{-ir}} verbs follow the model {{choisir}}: {{finir}}, {{grandir}}, {{maigrir}}.","blocks":[{"t":"table","rows":[["je choisis","nous choisissons"],["tu choisis","vous choisissez"],["il / elle / on choisit","ils / elles choisissent"]],"plain":1},{"t":"ul","items":["Pattern: stem + {{-is, -is, -it, -issons, -issez, -issent}}."]},{"t":"ex","items":[["Je finis à six heures.","Termino a las seis."],["Ils choisissent un film.","Eligen una película."]]},{"t":"h","x":"Other -ir verbs (irregular)"},{"t":"table","rows":[["partir","sortir","dormir"],["je pars","je sors","je dors"],["tu pars","tu sors","tu dors"],["il part","il sort","il dort"],["nous partons","nous sortons","nous dormons"],["vous partez","vous sortez","vous dormez"],["ils partent","ils sortent","ils dorment"]]},{"t":"note","k":"tip","x":"{{partir}} and {{sortir}} have one stem for the singular and another for the plural ({{pars}} / {{partons}})."}]},{"id":"more","en":"More irregular verbs","fr":"D'autres verbes irréguliers","src":["EN"],"key":"Common verbs you will meet very often.","blocks":[{"t":"table","rows":[["écrire","croire","vivre"],["j'écris","je crois","je vis"],["tu écris","tu crois","tu vis"],["il écrit","il croit","il vit"],["nous écrivons","nous croyons","nous vivons"],["vous écrivez","vous croyez","vous vivez"],["ils écrivent","ils croient","ils vivent"]]},{"t":"ex","items":[["J'écris un message.","Escribo un mensaje."],["Je crois que oui.","Creo que sí."],["Ils vivent à Beyrouth.","Viven en Beirut."]]},{"t":"ul","items":["The verbs in {{-aître}} follow {{connaître}}: {{paraître}}, {{reconnaître}}.","{{vivre}} is more \"live a life\", {{habiter}} is \"live somewhere\"."]}]},{"id":"reflexive","en":"Reflexive verbs","fr":"Les verbes pronominaux","src":["EN"],"key":"Reflexive verbs have a little word ({{me}}, {{te}}, {{se}}, {{nous}}, {{vous}}) before the verb.","blocks":[{"t":"table","rows":[["se coucher","s'amuser"],["je me couche","je m'amuse"],["tu te couches","tu t'amuses"],["il / elle / on se couche","il s'amuse"],["nous nous couchons","nous nous amusons"],["vous vous couchez","vous vous amusez"],["ils / elles se couchent","ils s'amusent"]]},{"t":"ul","items":["{{me}}, {{te}}, {{se}} become {{m'}}, {{t'}}, {{s'}} before a vowel or silent h."]},{"t":"ex","items":[["Je me lève à sept heures.","Me levanto a las siete."],["Elle s'habille en noir.","Se viste de negro."],["Comment tu t'appelles ? Je m'appelle Julie.","¿Cómo te llamas? Me llamo Julie."],["Il ne se lève pas tôt.","No se levanta temprano."]]},{"t":"ul","items":["Negation goes around both: {{ne}} + pronoun + verb + {{pas}}."]},{"t":"note","k":"es","x":"Exactly like Spanish [[me levanto]], [[te llamas]]. A lot of daily-routine verbs are reflexive in both languages: {{se lever}}, {{se coucher}}, {{s'habiller}}, {{se dépêcher}}."}]},{"id":"imperative","en":"The imperative","fr":"L'impératif","src":["EN"],"key":"Orders and invitations. It uses the {{tu}}, {{nous}} and {{vous}} forms without the subject pronoun.","blocks":[{"t":"table","rows":[["","affirmative","negative"],["tu","mange","ne mange pas"],["nous","mangeons","ne mangeons pas"],["vous","mangez","ne mangez pas"]]},{"t":"ex","items":[["Répondez !","¡Responda!"],["Écoute-moi !","¡Escúchame!"],["Ne fumez pas ici !","¡No fume aquí!"],["Entraîne-toi ! / Ne t'entraîne pas !","¡Entrénate! / ¡No te entrenes!"]]},{"t":"ul","items":["For {{-er}} verbs, the {{-s}} of the {{tu}} form disappears: {{tu parles}} → {{Parle !}}.","Reflexive: {{Lève-toi !}} (affirmative) but {{Ne te lève pas !}} (negative)."]},{"t":"note","k":"tip","x":"{{être}} and {{avoir}} have irregular imperatives: {{sois}} / {{soyons}} / {{soyez}} and {{aie}} / {{ayons}} / {{ayez}}."}]},{"id":"faut","en":"Obligation: il faut","fr":"L'obligation","src":["EN"],"key":"{{il faut}} states a general necessity. {{devoir}} puts it on a person.","blocks":[{"t":"ex","items":[["Il faut du silence pour travailler.","Hace falta silencio para trabajar."],["Il faut manger des légumes.","Hay que comer verduras."],["Il ne faut pas téléphoner en conduisant.","No hay que llamar por teléfono mientras se conduce."],["Tu dois faire attention.","Tienes que tener cuidado."],["On doit se taire pendant les cours.","Hay que callarse durante las clases."]]},{"t":"ul","items":["{{il faut}} + noun or infinitive.","{{il ne faut pas}} = prohibition.","{{il faut}} is impersonal: only {{il}}, never {{je faut}}."]},{"t":"note","k":"es","x":"{{il faut}} ≈ [[hay que]] / [[hace falta]]; {{devoir}} ≈ [[tener que]] / [[deber]]."}]},{"id":"pc","en":"The compound past: passé composé","fr":"Le passé composé","src":["EN"],"key":"Passé composé = {{avoir}} (or {{être}}) in the present + past participle. It is the everyday past for finished actions.","blocks":[{"t":"h","x":"With avoir (most verbs)"},{"t":"table","rows":[["je","j'ai parlé","nous","avons parlé"],["tu","as parlé","vous","avez parlé"],["il / elle / on","a parlé","ils / elles","ont parlé"]],"plain":1},{"t":"ex","items":[["Hier, j'ai travaillé et j'ai regardé un film.","Ayer trabajé y vi una película."],["Vous avez dîné ? J'ai mangé chez mes parents.","¿Han cenado? He comido en casa de mis padres."]]},{"t":"h","x":"Forming the past participle"},{"t":"table","rows":[["Verbs","Participle","Example"],["-er","-é","parler → parlé"],["-ir (regular)","-i","finir → fini, choisir → choisi"],["many others","-u","voir → vu, lire → lu, vouloir → voulu"],["some","-is / -it","prendre → pris, dire → dit, écrire → écrit"],["some","-ert","ouvrir → ouvert, offrir → offert"],["irregular","","être → été, avoir → eu, faire → fait"]]},{"t":"note","k":"warn","x":"With {{avoir}}, the participle does not agree with the subject: {{Elles ont parlé}}, not {{parlées}}."},{"t":"h","x":"With être"},{"t":"p","x":"About fifteen verbs of movement or change use {{être}}. Mnemonic: they describe going, coming, staying, being born or dying."},{"t":"table","rows":[["aller","allé","venir","venu"],["arriver","arrivé","partir","parti"],["entrer","entré","sortir","sorti"],["monter","monté","descendre","descendu"],["naître","né","mourir","mort"],["rester","resté","tomber","tombé"],["passer","passé","retourner","retourné"],["rentrer","rentré","devenir","devenu"]],"plain":1},{"t":"ul","items":["All reflexive verbs also use {{être}}.","The participle agrees with the subject: add {{-e}} (f.), {{-s}} (pl.)."]},{"t":"ex","items":[["Elle est allée au cinéma.","Ella fue al cine."],["Ils sont partis à minuit.","Se fueron a medianoche."],["Nous nous sommes levés tard.","Nos levantamos tarde."],["Elle s'est couchée tôt.","Ella se acostó temprano."]]},{"t":"table","rows":[["je suis allé(e)","nous sommes allé(e)s"],["tu es allé(e)","vous êtes allé(e)(s)"],["il est allé","ils sont allés"],["elle est allée","elles sont allées"]],"plain":1},{"t":"note","k":"es","x":"Spanish uses [[haber]] for every verb ([[he ido]]). French has two helpers: {{avoir}} for most, {{être}} for movement and reflexive verbs."}]},{"id":"pcneg","en":"Negative passé composé","fr":"La négation au passé composé","src":["EN"],"key":"{{ne}} and {{pas}} wrap the helper verb, not the participle.","blocks":[{"t":"ex","items":[["Je n'ai pas mangé.","No he comido."],["Il n'a jamais visité la Chine.","Nunca ha visitado China."],["Hier, je n'ai rien fait.","Ayer no hice nada."],["Elle n'est pas venue.","Ella no vino."],["Nous ne nous sommes pas dépêchés.","No nos dimos prisa."]]},{"t":"h","x":"Not yet and ever"},{"t":"ul","items":["{{ne ... pas encore}}: it will happen (still ahead): {{Tu connais déjà le directeur ? Non, je ne le connais pas encore.}}","{{ne ... jamais}}: it never happened."]},{"t":"note","k":"warn","x":"Don't combine {{pas}} with {{jamais}} or {{rien}}: {{Il n'a jamais visité Paris}}, not {{il n'a pas jamais visité}}."},{"t":"note","k":"tip","x":"Question with {{déjà}} → answer {{pas encore}} if you plan to. Question with {{souvent}} or {{quelquefois}} → answer {{jamais}} if never."}]},{"id":"impersonal","en":"Impersonal verbs","fr":"Les verbes impersonnels","src":["EN"],"key":"Some verbs only exist with {{il}} and do not refer to a person.","blocks":[{"t":"table","rows":[["infinitive","present","passé composé"],["falloir","il faut","il a fallu"],["pleuvoir","il pleut","il a plu"],["neiger","il neige","il a neigé"]]},{"t":"ex","items":[["Il pleut depuis ce matin.","Llueve desde esta mañana."],["Hier, il a plu sans arrêt.","Ayer llovió sin parar."],["Il faut partir.","Hay que irse."]]}]}]},{"id":"p5","title":"Everyday communication","sub":"Phrases for real situations","lessons":[{"id":"greetings","en":"Greetings, apologies, thanks","fr":"Saluer, s'excuser, remercier","src":["EN"],"key":"Match your greeting to the time of day and to how well you know the person.","blocks":[{"t":"h","x":"Greeting"},{"t":"table","rows":[["Situation","French","Spanish"],["Arriving (day)","Bonjour !","¡Buenos días! / ¡Buenas tardes!"],["Arriving (evening)","Bonsoir !","¡Buenas noches!"],["Polite, to a person","Bonjour, madame / monsieur.","Buenos días, señora / señor."],["Friends only","Salut ! Ça va ?","¡Hola! ¿Qué tal?"],["Asking how you are","Comment allez-vous ?","¿Cómo está usted?"],["Leaving","Au revoir !","¡Adiós!"],["Leaving (day)","Bonne journée !","¡Que tenga un buen día!"],["Leaving (evening)","Bonne soirée !","¡Que pase una buena noche!"],["Informal goodbye","À bientôt ! / À demain !","¡Hasta pronto! / ¡Hasta mañana!"]]},{"t":"h","x":"Apologising"},{"t":"ex","items":[["Pardon !","¡Perdón!"],["Excusez-moi.","Disculpe."],["Oh, excusez-moi, je suis désolé(e) !","¡Ay, perdón, lo siento!"]]},{"t":"h","x":"Thanking"},{"t":"ex","items":[["Merci.","Gracias."],["Merci beaucoup.","Muchas gracias."],["C'est très gentil !","¡Es muy amable!"],["Je vous remercie beaucoup.","Le agradezco mucho."],["De rien. / Je vous en prie.","De nada."]]},{"t":"note","k":"tip","x":"{{Je vous en prie}} is the polite \"you're welcome\" ({{vous}}); {{De rien}} or {{Pas de souci}} are more casual."},{"t":"note","k":"warn","x":"{{Salut}} is only for friends and family. Use {{Bonjour}} for strangers, shops and work."}]},{"id":"identity","en":"Giving and asking personal information","fr":"Demander et donner des informations","src":["EN"],"key":"Learn the question and the answer together. Use the {{vous}} form with strangers and the {{tu}} form with friends.","blocks":[{"t":"h","x":"Name and origin"},{"t":"ex","items":[["Comment vous appelez-vous ? Je m'appelle Sonia Legrand.","¿Cómo se llama? Me llamo Sonia Legrand."],["Tu viens d'où ? Je viens de Grèce.","¿De dónde eres? Vengo de Grecia."],["Quelle est votre nationalité ? Je suis grecque.","¿Cuál es su nacionalidad? Soy griega."]]},{"t":"h","x":"Work and studies"},{"t":"ex","items":[["Quelle est votre profession ? Je suis ingénieur.","¿Cuál es su profesión? Soy ingeniero."],["Qu'est-ce que vous faites dans la vie ? Je travaille dans l'informatique.","¿A qué se dedica? Trabajo en informática."],["Qu'est-ce que vous étudiez ? J'étudie la musique.","¿Qué estudia? Estudio música."]]},{"t":"h","x":"Address and contact"},{"t":"ex","items":[["Où habitez-vous ? J'habite à Madrid.","¿Dónde vive? Vivo en Madrid."],["Quel est votre numéro de portable ? C'est le 06 55 68 99 00.","¿Cuál es su número de móvil? Es el 06 55 68 99 00."],["Vous avez une adresse mail ? Oui, c'est ...","¿Tiene correo electrónico? Sí, es ..."]]},{"t":"h","x":"Age"},{"t":"ex","items":[["Quel âge avez-vous ? J'ai 21 ans.","¿Cuántos años tiene? Tengo 21 años."]]},{"t":"h","x":"With a friend (tu)"},{"t":"table","rows":[["vous","tu"],["Comment vous appelez-vous ?","Tu t'appelles comment ?"],["Vous venez d'où ?","Tu viens d'où ?"],["Où habitez-vous ?","Tu habites où ?"],["Quel âge avez-vous ?","Tu as quel âge ?"]]},{"t":"note","k":"tip","x":"Phone numbers are said in pairs: 06 55 68 99 00 = {{zéro six, cinquante-cinq, soixante-huit, quatre-vingt-dix-neuf, zéro zéro}}."},{"t":"note","k":"warn","x":"Age uses {{avoir}}: {{J'ai 21 ans}}. Do not say {{je suis 21 ans}}."}]},{"id":"opinions","en":"Likes, dislikes and opinions","fr":"Parler de ses goûts, donner son avis","src":["EN"],"key":"Use a scale of verbs to say how much you like something, and always use the definite article after them.","blocks":[{"t":"h","x":"Likes and dislikes"},{"t":"table","rows":[["French","Spanish"],["J'adore les maths.","Me encantan las mates."],["J'aime beaucoup le foot.","Me gusta mucho el fútbol."],["J'aime bien le français.","Me gusta el francés."],["Je n'aime pas beaucoup Théo.","No me cae muy bien Théo."],["Je n'aime pas la danse.","No me gusta el baile."],["Je n'aime pas du tout le fromage.","No me gusta nada el queso."],["Je déteste les films policiers.","Odio las películas policíacas."],["J'ai horreur de la pluie.","Detesto la lluvia."]]},{"t":"ul","items":["{{aimer}}, {{adorer}}, {{détester}} + {{le/la/les}} + noun, or + infinitive: {{J'aime danser.}}"]},{"t":"note","k":"warn","x":"With {{aimer}} for people, the meaning grows: {{J'aime Paul}} can be romantic. For friends say {{J'aime bien Paul}}."},{"t":"h","x":"Giving an opinion"},{"t":"ex","items":[["Il est très sympa. Je trouve qu'il est sympa.","Es muy simpático. Me parece que es simpático."],["Ce film est super / bien / nul.","Esta película es genial / está bien / es malísima."],["Ce n'est pas terrible.","No es gran cosa."]]}]},{"id":"agree","en":"Agreeing and disagreeing","fr":"Nuancer ses propos","src":["EN"],"key":"Four little answers tell someone whether you share their opinion.","blocks":[{"t":"table","rows":[["Their sentence","You agree","You disagree"],["positive (J'aime ...)","Moi aussi.","Pas moi."],["negative (Je n'aime pas ...)","Moi non plus.","Moi si."]]},{"t":"ex","items":[["J'aime le jardinage. Et toi ? Moi aussi, j'adore ça.","Me gusta la jardinería. ¿Y a ti? A mí también, me encanta."],["Je ne connais pas le Japon. Et toi ? Moi non plus.","No conozco Japón. ¿Y tú? Yo tampoco."],["J'adore les randonnées. Pas moi ! Je déteste ça.","Me encantan las excursiones. ¡A mí no! Lo detesto."],["Je n'aime pas bricoler. Et toi ? Moi si.","No me gusta hacer bricolaje. ¿Y a ti? A mí sí."]]},{"t":"note","k":"es","x":"{{moi aussi}} = [[yo también]], {{moi non plus}} = [[yo tampoco]], {{pas moi}} = [[yo no]], {{moi si}} = [[yo sí]]."},{"t":"note","k":"tip","x":"{{si}} is the French \"yes\" used to contradict a negative: {{Tu n'aimes pas ça ? Si !}}"}]},{"id":"classroom","en":"Useful phrases in class and in the street","fr":"Phrases utiles","src":["EN"],"key":"Survival phrases to ask for repetition, help and meaning.","blocks":[{"t":"table","rows":[["French","Spanish"],["Pardon ?","¿Perdón? ¿Cómo?"],["Vous pouvez répéter, s'il vous plaît ?","¿Puede repetir, por favor?"],["Plus lentement, s'il vous plaît.","Más despacio, por favor."],["Je ne comprends pas.","No entiendo."],["Comment ça s'écrit ?","¿Cómo se escribe?"],["Qu'est-ce que ça veut dire ?","¿Qué quiere decir?"],["Comment dit-on « ... » en français ?","¿Cómo se dice « ... » en francés?"],["Je ne sais pas.","No lo sé."],["Je parle un peu français.","Hablo un poco de francés."]]},{"t":"ex","items":[["Vous parlez espagnol ?","¿Habla español?"],["Je suis débutant(e).","Soy principiante."]]},{"t":"note","k":"tip","x":"{{s'il vous plaît}} is for {{vous}}. With a friend say {{s'il te plaît}}."}]}]}]}</script>
<script>
(function(){

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const DAY=864e5, INT=[0,1,3,7,14,30], MAX_DUE=40, KEY='mots-du-metro.v1';
const A1TEXT=document.getElementById('a1pack').textContent;
const GR=(()=>{try{return JSON.parse(document.getElementById('gdata').textContent);}catch(e){return {parts:[]};}})();
const GL=[]; GR.parts.forEach((p,pi)=>p.lessons.forEach(l=>{l.pi=pi;l.n=GL.length+1;GL.push(l);}));
const GBY=new Map(GL.map(l=>[l.id,l]));
const GSRC={GP:'Grammaire progressive du français, niveau débutant (A1)',EN:'Entre nous 1, précis de grammaire'};

const TYPES={

  adverb:{label:'Adverb',abbr:'adv'}, preposition:{label:'Preposition',abbr:'prep'}, pronoun:{label:'Pronoun',abbr:'pron'},
  conjunction:{label:'Conjunction',abbr:'conj'}, determiner:{label:'Determiner',abbr:'det'}, number:{label:'Number',abbr:'num'},
  expression:{label:'Expression',abbr:'exp'}, other:{label:'Other',abbr:'•'}
};
