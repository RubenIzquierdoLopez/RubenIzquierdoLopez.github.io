research_experience:

  - role: PhD Researcher
    institution: Instituto de Ciencias Matemáticas (ICMAT)
    period: 2024--present
    detail: For developing by PhD in CSIC (Instituto de Ciencias Matemáticas) under the supervision of Manuel de León. We are currently researching `graded Dirac' and `graded Poisson' structures for the study of classical field theories.'
  
  - role: Severo Ochoa contract for Master students
    institution: Instituto de Ciencias Matemáticas (ICMAT)
    period: 2023-2024
    detail: Contract for developing my master thesis under the supervision of Manuel de León. We developed the multisymplectic coisotropic reduction.
  
