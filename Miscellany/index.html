---
<!doctype html>
<html lang="en">
<head>
  <title>Miscellany | Rubén Izquierdo López</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  {% include navigation.html active='miscellany' %}

  <main class="PersonalInfo miscellany-page" id="Miscellany">
    {% for item in site.data.miscellany %}
    <section class="miscellany-content" aria-labelledby="miscellany-title">
      <h1 id="miscellany-title">{{ item.title }}</h1>
      <p>{{ item.description }} For more information, see the <a href="{{ item.link }}" target="_blank" rel="noopener">{{ item.link_label }}</a>.</p>
    </section>
    {% endfor %}
  </main>
</body>
</html>
